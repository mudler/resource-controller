<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>resource controller</title>
<!-- The tab icon, inline as a data: URI. A file would be a second request
     and a second embedded asset; a missing one is a 404 in every browser
     console. This is neither. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316181d'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23c86c08'/%3E%3C/svg%3E">
<style>
  /* A calm status board. It should be nearly quiet when the fleet is fine,
     and unmistakable when it is not — so exactly one thing on this page is
     allowed to be loud, and that is a device that has left the pool.

     Neutrals are tinted toward the mark's slate rather than pure grey, and
     nothing is pure black or pure white. Light and dark both come from the
     viewer's system preference; there is no theme switch, because a switch
     is one more control on a page whose whole point is having few. */
  :root {
    --bg:#fbfbfd; --panel:#fff; --sunk:#f4f5f8; --hover:#f6f7fa;
    --ink:#16181d; --ink-2:#3f4653; --muted:#6b7280; --faint:#9aa1ab;
    --line:#e4e6ec; --line-2:#d3d7e0;
    --ready:#15803d; --busy:#b45309; --unknown:#6d28d9; --bad:#b91c1c;
    --bad-bg:#fdf3f3; --bad-line:#f0c9c9;
    --warn:#a15c07; --warn-bg:#fdf8ef; --warn-line:#eddcc0;
    --accent:#c86c08;
    /* The timeline's one categorical pair, plus the hatch it uses for a
       device that has left the pool. Validated with the palette checker:
       dE 21.4 normal vision, 15.7 protan, comfortably clear of the floor. */
    --job-mine:#c86c08; --job-other:#4a5878; --hatch-bad:rgba(185,28,28,.16);
    --shadow:0 1px 2px rgba(20,22,28,.05);
    /* Spacing scale. Before this the stylesheet used ten different gap values
       (4,7,8,9,10,11,12,13,14,30) with no relationship between them, so every
       new rule guessed. The steps are taken from what the page already was
       rather than imposed on it: 10px stays its own step because it was the
       most used and the board's density is deliberate. Collapsing only the
       near-duplicates moved nothing by more than a pixel. */
    --sp-1:4px; --sp-2:8px; --sp-3:10px; --sp-4:12px; --sp-5:14px; --sp-6:30px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#16181d; --panel:#1c1f26; --sunk:#232732; --hover:#232732;
      --ink:#e8eaed; --ink-2:#c3c8d2; --muted:#949ba7; --faint:#767d8a;
      --line:#2b303b; --line-2:#3a4150;
      --ready:#4ade80; --busy:#fbbf24; --unknown:#c4b5fd; --bad:#fca5a5;
      --bad-bg:#2b1618; --bad-line:#5c2a2c;
      --warn:#fbbf24; --warn-bg:#2a2113; --warn-line:#4a3a18;
      --accent:#f0913a;
      /* Dark needs its own steps, not an inversion: the light accent sits
         above the dark-mode lightness band and would glare. */
      --job-mine:#cc7524; --job-other:#8894ad; --hatch-bad:rgba(252,165,165,.18);
      --shadow:none;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .hide { display:none !important; }

  header {
    display:flex; align-items:center; gap:var(--sp-5); flex-wrap:wrap;
    padding:14px 24px; border-bottom:1px solid var(--line);
    background:var(--panel); position:sticky; top:0; z-index:5;
  }
  header .brand { display:flex; align-items:center; gap:var(--sp-3); margin-right:auto; }
  header svg { display:block; }
  h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:-.01em; }
  .fleet-statement, .running-head h2, .workspace-head h2 {
    font-family:inherit; font-size:2.125rem; line-height:1.22;
    font-weight:500; letter-spacing:-.015em;
  }
  .live { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:var(--sp-2); }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--ready); flex:none; }
  .live.warn .dot { background:var(--warn); }
  .live.stale .dot { background:var(--bad); }
  .live.stale { color:var(--bad); font-weight:600; }
  #act { font-size:13px; color:var(--muted); }
  #act.bad { color:var(--bad); font-weight:600; }
  #err { font-size:13px; color:var(--bad); }
  .badge { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
           color:var(--accent); border:1px solid var(--accent); border-radius:100px;
           padding:1px 8px; }

  main { padding:26px 24px 40px; max-width:1240px; margin:0 auto; }

  .fleet-head { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px 28px;
                align-items:end; margin-bottom:26px; }
  .fleet-statement { margin:0; max-width:850px; }
  .fleet-statement b { font-weight:650; }
  .fleet-statement .bad { color:var(--bad); }
  .fleet-facts { display:flex; gap:7px 24px; flex-wrap:wrap; margin-top:12px;
                 color:var(--muted); font-size:13.5px; font-variant-numeric:tabular-nums; }
  .fleet-fact { display:flex; gap:6px; align-items:baseline; }
  .fleet-fact b { color:var(--ink); font-weight:600; }
  .fleet-fact.warn, .fleet-fact.warn b { color:var(--warn); }
  .fleet-head-controls { display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap; align-self:start; }
  .fleet-mode { display:inline-flex; align-self:start; padding:3px; border:1px solid var(--line);
                background:var(--sunk); border-radius:9px; }
  .fleet-mode button { border:0; background:transparent; color:var(--muted); font:inherit;
                       font-size:12.5px; padding:5px 10px; border-radius:6px; cursor:pointer; }
  .fleet-mode button[aria-pressed="true"] { color:var(--ink); background:var(--panel);
                                             box-shadow:var(--shadow); }
  .overview-grid.has-attention { display:grid; grid-template-columns:minmax(0,1fr) 330px;
                                 gap:var(--sp-6); align-items:start; }
  .machine-room { min-width:0; }
  .bay { margin-bottom:22px; border:1px solid var(--line); border-radius:10px;
         background:var(--panel); box-shadow:var(--shadow); overflow:hidden; }
  .bay-head { display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-4);
              padding:12px 15px; background:var(--sunk); border-bottom:1px solid var(--line); }
  .bay-name { font-size:14px; font-weight:650; letter-spacing:-.005em; }
  .bay-facts { font-size:12px; color:var(--muted); text-align:right; }
  .bay-body .rows { border:0; border-radius:0; box-shadow:none; }
  .machine-room.matrix { border:1px solid var(--line); border-radius:10px; overflow:auto;
                         background:var(--panel); max-height:min(70vh,760px); }
  .matrix-table { border-collapse:collapse; width:100%; min-width:760px; font-size:13px; }
  .matrix-table th { position:sticky; top:0; z-index:2; background:var(--sunk); color:var(--muted);
                     font-size:12px; font-weight:600; text-align:left; padding:9px 12px;
                     border-bottom:1px solid var(--line); }
  .matrix-table td { border-top:1px solid var(--line); padding:10px 12px; vertical-align:top; }
  .matrix-table tbody tr:first-child td { border-top:0; }
  .matrix-table tr.unhealthy { background:var(--bad-bg); }
  .matrix-table .matrix-open { border:0; background:none; color:inherit; font:inherit;
                               padding:0; text-align:left; cursor:pointer; }
  .matrix-table .matrix-id { display:block; font-weight:650; }
  .matrix-table .matrix-meta { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  [data-device-id].work-match { outline:2px solid var(--accent); outline-offset:-2px;
                                background:var(--warn-bg); }
  .attention { border:1px solid var(--bad-line); border-radius:10px; background:var(--panel);
               box-shadow:var(--shadow); overflow:hidden; }
  .attention-head { padding:12px 14px; border-bottom:1px solid var(--bad-line); }
  .attention-head h2 { margin:0; font-size:15px; color:var(--bad); }
  .incident { padding:12px 14px; border-bottom:1px solid var(--line); }
  .incident:last-child { border-bottom:0; }
  .incident b { display:block; font-size:13.5px; }
  .incident span { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
  .changes { border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
  .work-strip { margin-top:30px; }
  @media (max-width:980px) {
    .overview-grid.has-attention { display:flex; flex-direction:column; }
    .overview-grid.has-attention .attention { order:-1; width:100%; }
  }
  @media (max-width:680px) {
    main { padding-left:14px; padding-right:14px; }
    .fleet-head { grid-template-columns:minmax(0,1fr); }
    .fleet-mode { justify-self:start; }
    .bay-head { display:block; }
    .bay-facts { text-align:left; margin-top:3px; }
  }

  /* Summary line: the whole fleet in one sentence, so a glance needs no
     counting. It is the first thing read and usually the only thing. */
  .summary { font-size:20px; color:var(--ink-2); margin:0 0 4px; letter-spacing:-.015em; }
  .summary b { color:var(--ink); font-weight:600; }
  .summary .bad { color:var(--bad); font-weight:600; }
  .sub { font-size:13px; color:var(--muted); margin:0 0 26px; }
  .sub .long { color:var(--warn); font-weight:600; }

  .sec { font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.08em;
         text-transform:uppercase; margin:0 0 10px; }
  .host { margin-bottom:22px; }
  .host-name {
    font-size:12px; font-weight:600; color:var(--muted);
    letter-spacing:.06em; text-transform:uppercase;
    display:flex; align-items:baseline; gap:var(--sp-2); margin-bottom:8px;
  }
  .host-note { font-size:12px; letter-spacing:0; text-transform:none;
               font-weight:400; color:var(--faint); }

  .rows { border:1px solid var(--line); border-radius:12px; overflow:hidden;
          background:var(--panel); box-shadow:var(--shadow); }
  .row { display:flex; align-items:stretch; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row.down { background:var(--bad-bg); }

  /* The row body is one button: the whole line is the click target that
     opens the detail, and it is reachable by keyboard for free. The
     per-row actions live outside it, since a button may not nest. */
  .open { flex:1; min-width:0; display:block; width:100%; text-align:left;
          background:none; border:0; color:inherit; font:inherit;
          padding:14px 8px 14px 16px; cursor:pointer; }
  /* A device row, unlike a work row, leads with its glyph: the drawing is a
     column of its own and the text stacks beside it. Work rows keep the
     plain block layout above. */
  .open.devrow { display:flex; align-items:flex-start; gap:var(--sp-4); padding-left:14px; }
  .rowbody { flex:1; min-width:0; }
  .open:hover { background:var(--hover); }
  /* The rows box clips its corners, so an outlined focus ring drawn OUTSIDE
     the button would be cut off at the top and bottom of the list. Drawn
     inside, it stays whole wherever the row is. */
  .open:focus-visible, .ev-open:focus-visible { outline-offset:-2px; }
  .row.down .open:hover { background:transparent; text-decoration:none; }
  .row.down .open:hover .dev { text-decoration:underline; }
  .actions { display:flex; align-items:center; gap:var(--sp-2); padding:12px 14px 12px 0; flex:none; }

  .line1 { display:flex; align-items:baseline; gap:var(--sp-3); flex-wrap:wrap; }
  /* The state pip carries the state at a glance; the word beside it carries
     it for anyone who cannot separate these hues. Never colour alone. */
  .pip { width:9px; height:9px; border-radius:50%; align-self:center; flex:none; background:var(--faint); }
  .pip.ready { background:var(--ready); }
  .pip.busy { background:var(--busy); }
  .pip.unknown { background:var(--unknown); }
  .pip.unhealthy { background:var(--bad); }
  .dev { font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .state { font-size:12px; font-weight:600; letter-spacing:.02em; }
  .state.ready { color:var(--ready); } .state.busy { color:var(--busy); }
  .state.unknown { color:var(--unknown); } .state.unhealthy { color:var(--bad); }
  .state.waiting { color:var(--muted); }
  .spec { font-size:12px; color:var(--faint); }

  /* ---- rail, glyph, pill --------------------------------------------
     One fact carried three ways, so that none of them is carrying it
     alone. The rail is the colour a glance catches without reading, down
     the full height of the row. The pill says the same thing in words, for
     a reader who cannot separate these hues or is looking at the screen
     from the side. The glyph changes SHAPE — not merely colour — when a
     device leaves the pool. Take the colour out of any of it and the row
     still says what it says. */
  .rail { flex:none; width:4px; align-self:stretch; background:var(--faint); }
  .rail.ready { background:var(--ready); }
  .rail.busy { background:var(--busy); }
  .rail.unknown { background:var(--unknown); }
  .rail.unhealthy { background:var(--bad); }

  /* Every glyph is one of the four <template>s at the foot of this page,
     cloned. They carry no colour of their own: the three variables below
     are all a drawing ever names, so one drawing serves every state, and
     both palettes come free with the tokens. */
  .glyph { display:block; flex:none; fill:none; stroke-width:var(--gw);
           --gw:1.6; --g-ink:var(--ink-2); --g-faint:var(--faint); --g-accent:var(--faint); }
  .glyph .ink { stroke:var(--g-ink); }
  .glyph .faint { stroke:var(--g-faint); }
  .glyph .mark { stroke:var(--g-accent); }
  .glyph .core { fill:var(--g-accent); }
  .glyph .core-soft { fill:var(--g-accent); opacity:.32; }
  .glyph .hi { stroke-width:calc(var(--gw) * 1.5); }
  .glyph.ready { --g-accent:var(--ready); }
  .glyph.busy { --g-accent:var(--busy); }
  .glyph.unknown { --g-accent:var(--unknown); }
  .glyph.unhealthy { --g-ink:var(--bad); --g-accent:var(--bad); }
  /* One viewBox at two sizes, so the stroke is set in the drawing's own
     units per size rather than shrinking with it — a hairline at 26px is
     not a smaller version of the portrait, it is an invisible one. */
  .glyph-sm { width:26px; height:26px; --gw:2.4; margin-top:1px; }
  .glyph-lg { width:42px; height:42px; --gw:1.7; }

  .pill { display:inline-flex; align-items:center; font-size:12px; font-weight:600;
          padding:2px 9px; border-radius:100px; border:1px solid transparent; }
  .pill.ready { color:var(--ready); border-color:color-mix(in srgb,var(--ready) 35%,transparent); }
  .pill.busy { color:var(--busy); border-color:color-mix(in srgb,var(--busy) 35%,transparent);
               background:var(--warn-bg); }
  .pill.unknown { color:var(--unknown);
                  border-color:color-mix(in srgb,var(--unknown) 35%,transparent); }
  .pill.unhealthy { color:var(--bad); border-color:color-mix(in srgb,var(--bad) 35%,transparent);
                    background:var(--bad-bg); }
  /* The row itself is already tinted when a device is out of the pool, so
     the pill needs the panel behind it to stay a pill rather than a
     floating word. */
  .row.down .pill.unhealthy { background:var(--panel); }

  .line2 { font-size:13.5px; color:var(--ink-2); margin-top:4px; }
  .line2 .who { font-weight:500; }
  .line2 .dur { color:var(--muted); }
  .line2 .quiet { color:var(--warn); }

  /* The command is the one thing on this page that can be kilobytes long,
     and it is rarely what the reader came for — so on the board it is a
     single dim line that can never widen a column, and the whole of it
     lives one click away in the detail panel. */
  .cmd { margin-top:4px; font-size:12px; color:var(--muted);
         overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }

  /* The explanation for a device that has left the pool. This is the single
     most important string on the page: it is why the device is gone and it
     decides whether returning it is safe. */
  .why { margin-top:8px; padding:9px 11px; background:var(--panel); border:1px solid var(--bad-line);
         border-radius:8px; font-size:13px; color:var(--ink); }
  .why b { color:var(--bad); font-weight:600; display:block; }
  .why .txt { display:block; margin-top:3px; color:var(--ink-2); word-break:break-word; }

  .waits { margin-top:6px; font-size:12.5px; color:var(--muted); }
  .waits .w { display:block; }
  .waits .long { color:var(--warn); font-weight:600; }
  .spec.long { color:var(--warn); font-weight:600; }

  button.act { border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2);
               border-radius:8px; padding:5px 11px; font:inherit; font-size:12.5px; cursor:pointer; }
  button.act:hover { border-color:var(--accent); color:var(--accent); }
  button.act.danger { border-color:var(--bad-line); color:var(--bad); }
  button.act.foreign { color:var(--faint); }
  .chev { color:var(--faint); font-size:13px; padding:0 2px; }

  .empty { color:var(--muted); padding:26px 16px; text-align:center; background:var(--panel);
           border:1px solid var(--line); border-radius:12px; }
  .empty .hint { font-size:13px; color:var(--faint); margin-top:6px; }

  /* ---- activity feed ------------------------------------------------- */
  .feed { border:1px solid var(--line); border-radius:12px; background:var(--panel);
          box-shadow:var(--shadow); overflow:hidden; }
  .ev { display:flex; border-top:1px solid var(--line); }
  .ev:first-child { border-top:0; }
  .ev-open, .ev-static { flex:1; min-width:0; display:flex; gap:var(--sp-2); align-items:baseline;
                         text-align:left; background:none; border:0; color:inherit; font:inherit;
                         padding:9px 12px; font-size:12.5px; }
  .ev-open { cursor:pointer; }
  .ev-open:hover { background:var(--hover); }
  .ev-time { flex:none; width:46px; color:var(--faint); font-size:11.5px; }
  .ev-text { color:var(--ink-2); min-width:0; word-break:break-word; }
  .ev-text b { font-weight:600; color:var(--ink); }
  .ev.bad .ev-text { color:var(--bad); }
  .ev.good .ev-text b { color:var(--ink); }
  .feed-note { font-size:11.5px; color:var(--faint); margin:8px 2px 0; }

  /* ---- utilization cells ---------------------------------------------- */
  .cells { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:var(--sp-4); }
  .cell { border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:12px 14px; }
  .cell .n { font-size:25px; font-weight:600; letter-spacing:-.025em; font-variant-numeric:tabular-nums; }
  .cell .n.bad { color:var(--bad); } .cell .n.ok { color:var(--ready); }
  .cell .l { font-size:11.5px; color:var(--muted); margin-top:5px; }
  .ubar { height:6px; border-radius:100px; background:var(--sunk); margin-top:9px; overflow:hidden; }
  .ubar i { display:block; height:100%; background:var(--job-other); border-radius:100px; }

  /* ---- destinations -------------------------------------------------- */
  .places { display:flex; gap:2px; }
  .places button { border:0; background:none; font:inherit; font-size:13.5px; color:var(--muted);
                   padding:5px 11px; border-radius:8px; cursor:pointer; }
  .places button:hover { background:var(--hover); color:var(--ink); }
  .places button[aria-current="page"] { background:var(--sunk); color:var(--ink); font-weight:600; }
  .places .n { margin-left:6px; font-size:11.5px; color:var(--faint); font-variant-numeric:tabular-nums; }

  /* ---- running now ----------------------------------------------------
     Every active lease on one screen. Watching three jobs used to mean
     opening three pages one at a time. */
  .running-head { margin-bottom:18px; }
  .running-head h2 { margin:0 0 4px; }
  .running-sub { font-size:13px; color:var(--muted); margin:0; }
  .running-sub .warn { color:var(--warn); font-weight:600; }
  .run { border:1px solid var(--line); border-radius:11px; background:var(--panel);
         box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden; }
  .run-top { display:flex; align-items:center; gap:var(--sp-3); padding:11px 14px 9px; flex-wrap:wrap; }
  .run-top .id { font-size:14px; font-weight:600; }
  .run-top .who { font-size:13px; color:var(--ink-2); }
  /* Not ".open": the machine room already uses that for a device row, where
     it means the whole row is the click target — flex:1 and width:100%. */
  .run-top .run-open { margin-left:auto; flex:none; }
  .run-meter { padding:0 14px 10px; }
  .run-track { position:relative; height:7px; border-radius:100px; background:var(--sunk); overflow:hidden; }
  .run-fill { position:absolute; top:0; bottom:0; left:0; border-radius:100px; background:var(--job-other); }
  .run-fill.mine { background:var(--job-mine); }
  .run-fill.soon { background:var(--warn); }
  .run-meta { display:flex; gap:var(--sp-3); margin-top:6px; font-size:11.5px; color:var(--muted);
              font-variant-numeric:tabular-nums; flex-wrap:wrap; }
  .run-meta .r { margin-left:auto; }
  .run-meta .soon { color:var(--warn); font-weight:600; }
  .run-tail { background:var(--sunk); border-top:1px solid var(--line); padding:8px 14px;
              font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px;
              line-height:1.6; color:var(--ink-2); white-space:pre; overflow:hidden; height:60px; }
  .run-note { background:var(--sunk); border-top:1px solid var(--line); padding:9px 14px;
              font-size:12.5px; color:var(--muted); }

  /* ---- the life of one run ------------------------------------------
     A job's own axis: the wait for a card, the run so far, and the moment
     the controller will stop it. max_runtime_seconds is a real field, so
     that moment is a fact rather than an estimate. */
  .life { border:1px solid var(--line); border-radius:10px; background:var(--panel);
          padding:13px 15px 14px; }
  .life-top { display:flex; align-items:baseline; gap:var(--sp-3); margin-bottom:9px;
              font-size:12px; color:var(--muted); }
  .life-top .t { margin-left:auto; font-variant-numeric:tabular-nums; }
  .life-track { position:relative; height:24px; border-radius:5px; background:var(--sunk); overflow:hidden; }
  .life-seg { position:absolute; top:0; bottom:0; display:flex; align-items:center; padding:0 9px;
              font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; color:#fff; }
  .life-seg.queued { color:var(--ink-2);
    background-image:repeating-linear-gradient(45deg,var(--line-2) 0 6px,transparent 6px 12px); }
  .life-seg.run { background:var(--job-mine); }
  .life-seg.run.other { background:var(--job-other); }
  .life-seg.left { background:none; color:var(--muted); font-weight:500; }
  .life-cap { position:absolute; top:0; bottom:0; width:0; border-left:2px solid var(--bad); z-index:3; }
  .life-marks { position:relative; height:15px; margin-top:4px; }
  .life-mark { position:absolute; transform:translateX(-50%); white-space:nowrap; font-size:10.5px;
               font-weight:500; color:var(--faint);
               font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .life-mark.at-start { transform:none; }
  .life-mark.at-end { transform:translateX(-100%); }
  .life-mark.now { color:var(--accent); font-weight:600; }
  .life-mark.cap { color:var(--bad); }
  .life-say { margin-top:10px; font-size:12.5px; color:var(--muted); }
  .life-say b { color:var(--ink-2); font-weight:600; }

  /* ---- the day ------------------------------------------------------
     Devices are lanes and jobs are bars across them. Occupancy is ink and
     availability is the whitespace between bars: the gaps ARE the free
     capacity, which reads faster than painting half a fleet green and keeps
     the page quiet until something is actually wrong. */
  .machine-room.day { display:block; }
  .day-head { display:flex; align-items:center; gap:var(--sp-4); flex-wrap:wrap; margin-bottom:12px; }
  .day-window { display:flex; border:1px solid var(--line-2); border-radius:8px; overflow:hidden; }
  .day-window button { border:0; border-left:1px solid var(--line-2); background:var(--panel);
                       color:var(--muted); font:inherit; font-size:12px; padding:4px 11px; cursor:pointer; }
  .day-window button:first-child { border-left:0; }
  .day-window button[aria-pressed="true"] { background:var(--accent); color:#fff; font-weight:600; }
  .day-scroll { overflow-x:auto; }
  .day-grid { min-width:640px; position:relative; }
  .day-axis { display:grid; grid-template-columns:150px minmax(0,1fr); align-items:end; margin-bottom:3px; }
  .day-ticks { position:relative; height:16px; }
  .day-tick { position:absolute; top:0; transform:translateX(-50%); white-space:nowrap;
              font-size:10.5px; font-weight:500; color:var(--faint);
              font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .day-tick.now { color:var(--accent); font-weight:600; background:var(--bg); padding:0 5px; z-index:3; }
  .day-hostrow { display:flex; align-items:baseline; gap:var(--sp-3); padding:14px 0 5px; }
  .day-hostrow button { border:0; background:none; padding:0; cursor:pointer; color:var(--muted);
                        font:inherit; font-size:11px; font-weight:600; letter-spacing:.08em;
                        text-transform:uppercase; }
  .day-hostrow button:hover { color:var(--accent); text-decoration:underline; }
  .day-hostrow .facts { font-size:11.5px; color:var(--faint); }
  .day-hostrow .beat { margin-left:auto; font-size:11.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .day-hostrow .beat.bad { color:var(--bad); font-weight:600; }
  .day-lane { display:grid; grid-template-columns:150px minmax(0,1fr); align-items:center; height:38px; }
  .day-name { padding-right:12px; min-width:0; overflow:hidden; }
  .day-name button { border:0; background:none; padding:0; cursor:pointer; text-align:left; width:100%;
                     color:var(--ink-2); font:inherit; font-size:12.5px; font-weight:600;
                     line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .day-name button:hover { color:var(--accent); text-decoration:underline; }
  .day-name .st { display:block; font-weight:400; font-size:10.5px; line-height:1.2; color:var(--faint);
                  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .day-name .st.unhealthy { color:var(--bad); font-weight:600; }
  .day-track { position:relative; height:100%; border-bottom:1px solid var(--line);
               background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px var(--day-col)); }
  .day-future { position:absolute; top:0; bottom:0; background:var(--sunk); opacity:.55; z-index:0; pointer-events:none; }
  .day-nowlayer { position:absolute; left:150px; right:0; top:16px; bottom:0;
                  z-index:4; pointer-events:none; }
  .day-nowline { position:absolute; top:0; bottom:0; width:0; border-left:1.5px solid var(--accent); }
  /* One categorical distinction only — your work against everyone else's —
     validated for colour-vision deficiency at dE 21.4 normal, 15.7 protan.
     The submitter is written on any bar with room, so identity never rests
     on hue alone. */
  .day-job { position:absolute; top:5px; height:27px; border:0; border-radius:3px; padding:0 7px;
             overflow:hidden; display:flex; align-items:center; cursor:pointer; z-index:2;
             color:#fff; font:inherit; font-size:11px; font-weight:500; white-space:nowrap;
             box-shadow:0 0 0 2px var(--bg); background:var(--job-other); }
  .day-job.mine { background:var(--job-mine); }
  /* A run that worked for four hours and then died was not failing for four
     hours, and painting the whole bar red says it was. The bar keeps the
     colour of the work — who held the card, which is what the lane is about —
     and the failure is marked where it actually happened, at the end. A short
     failed run is almost all cap, which is exactly right: those are the ones
     that should read as red at a glance. */
  .day-job.failed::after { content:""; position:absolute; right:0; top:0; bottom:0;
                           width:5px; background:var(--bad); }
  .day-job:hover { filter:brightness(1.13); }
  .day-job:focus-visible { outline:2px solid var(--ink); outline-offset:1px; }
  /* A textured span is the encoding that survives greyscale and colour-vision
     deficiency, so the texture must stay legible AS texture: type is never
     set on it. The words sit on an opaque plate at the head of the span and
     say WHEN the state began — the state word itself is already in the lane
     label beside it and in the legend below. */
  .day-span { position:absolute; top:4px; height:29px; border-radius:3px; overflow:hidden;
              display:flex; align-items:stretch; padding:0; z-index:2; }
  .day-span.unhealthy { border:1px solid var(--bad-line);
    background-image:repeating-linear-gradient(45deg,var(--hatch-bad) 0 5px,transparent 5px 10px); }
  .day-span.unknown { border:1px dashed var(--line-2);
    background-image:repeating-linear-gradient(45deg,var(--line) 0 5px,transparent 5px 10px); }
  .day-plate { display:flex; align-items:center; flex:none; padding:0 8px; background:var(--panel);
               font-size:11px; font-weight:600; white-space:nowrap; border-radius:2px 0 0 2px;
               font-variant-numeric:tabular-nums; }
  .day-span.unhealthy .day-plate { color:var(--bad); border-right:1px solid var(--bad-line); }
  .day-span.unknown .day-plate { color:var(--muted); font-weight:500; border-right:1px solid var(--line-2); }
  /* Queued work is an outline, not a fill: it has not happened yet. */
  .day-ghost { position:absolute; height:27px; border:1.5px dashed var(--faint); background:none;
               border-radius:3px; padding:0 7px; overflow:hidden; display:flex; align-items:center;
               cursor:pointer; z-index:2; color:var(--muted); font:inherit; font-size:11px;
               white-space:nowrap; }
  .day-ghost:hover { border-color:var(--accent); color:var(--accent); }
  .day-legend { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:14px; padding-top:11px;
                border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); }
  .day-legend span { display:flex; align-items:center; gap:6px; }
  .day-legend i { width:14px; height:9px; border-radius:2px; display:block; flex:none; }
  .day-empty { padding:22px 4px; color:var(--muted); font-size:13px; }

  /* ---- entity workspaces -------------------------------------------- */
  .workspace-head { display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--sp-4);
                    align-items:start; margin-bottom:26px; padding-bottom:16px;
                    border-bottom:1px solid var(--line); }
  .workspace-head h2 { margin:2px 0 0; overflow-wrap:anywhere; }
  .workspace-kind { display:block; font-size:11px; color:var(--muted); letter-spacing:.08em;
                    text-transform:uppercase; }
  .workspace-body { max-width:none; }
  /* The output is what the reader came for, so it gets the room and the
     facts get a rail. This was the other way round, with the log in the
     narrower column at a fixed 260px — the same twelve lines on a laptop and
     on a 4K display. */
  .workspace-body.job-layout { display:grid; grid-template-columns:minmax(0,320px) minmax(0,1fr);
                               gap:20px 26px; align-items:start; }
  #workspaceLife { grid-column:1 / -1; }
  /* A DEFINITE height, not a minimum. Inside a grid whose items size to their
     content, flex:1 on a min-height box just grows forever: the pane never
     overflows, so it never scrolls, and "is the reader at the bottom" is
     trivially true no matter how much output arrives. */
  .workspace-output { display:flex; flex-direction:column; min-width:0;
                      height:clamp(320px,62vh,900px); }
  .workspace-output > .block { display:flex; flex-direction:column; flex:1; min-height:0; margin:0; }
  .workspace-output .log { height:auto; flex:1; min-height:0; }
  .workspace-tabs { display:none; }
  .host-devices { margin-top:22px; }
  .host-open { border:0; background:none; color:inherit; font:inherit; padding:0; cursor:pointer; }
  .host-open:hover { color:var(--accent); }
  .iconbtn { border:0; background:none; color:var(--muted); font:inherit; font-size:17px;
             line-height:1; cursor:pointer; padding:4px 7px; border-radius:7px; }
  .iconbtn:hover { color:var(--accent); background:var(--hover); }
  @media (max-width:760px) {
    .workspace-body.job-layout { display:block; }
    .workspace-tabs { display:flex; gap:var(--sp-2); margin-bottom:16px; border-bottom:1px solid var(--line); }
    .workspace-tabs button { border:0; border-bottom:2px solid transparent; background:none;
                             color:var(--muted); padding:8px 2px; margin-right:14px; font:inherit; cursor:pointer; }
    .workspace-tabs button[aria-selected="true"] { color:var(--ink); border-color:var(--accent); }
    .workspace-body[data-tab="details"] .workspace-output,
    .workspace-body[data-tab="output"] #workspaceMain { display:none; }
  }

  .big { font-size:19px; font-weight:600; letter-spacing:-.015em; margin:0 0 2px; }
  .big.ready { color:var(--ready); } .big.busy { color:var(--busy); }
  .big.unknown { color:var(--unknown); } .big.unhealthy { color:var(--bad); }
  .big.failed { color:var(--bad); } .big.done { color:var(--ready); }
  .under { font-size:13px; color:var(--muted); margin:0 0 16px; }

  /* ---- the hardware portrait ----------------------------------------
     What this machine IS, at the head of what the controller knows about
     it: the glyph large enough to recognise, the one spec line that bears
     on a scheduling decision, and how much of the device is spoken for. */
  .portrait { border:1px solid var(--line); border-radius:10px; background:var(--sunk);
              padding:14px; margin:0 0 20px; display:flex; flex-direction:column; gap:var(--sp-4); }
  .portrait.unhealthy { border-color:var(--bad-line); background:var(--bad-bg); }
  .ptop { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--sp-4); }
  .pname { font-size:15px; font-weight:600; letter-spacing:-.01em; word-break:break-word; }
  .pspec { color:var(--muted); font-size:12.5px; margin-top:2px; word-break:break-word; }
  .meter { height:5px; background:var(--line); border-radius:100px; overflow:hidden; }
  .meter > i { display:block; height:100%; border-radius:100px; background:var(--faint); }
  .meter > i.busy { background:var(--busy); }
  .meter > i.unhealthy { background:var(--bad); opacity:.4; }
  .meter > i.unknown { background:var(--unknown); opacity:.5; }
  .pfoot { display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-3);
           font-size:12.5px; color:var(--muted); }
  .pfoot .tnum { font-variant-numeric:tabular-nums; flex:none; }

  .note { padding:12px 14px; border-radius:9px; font-size:13.5px; margin:0 0 16px;
          background:var(--sunk); border:1px solid var(--line); }
  .note.alarm { background:var(--bad-bg); border-color:var(--bad-line); }
  .note.caution { background:var(--warn-bg); border-color:var(--warn-line); }
  .note h3 { font-size:13.5px; margin:0 0 5px; font-weight:600; }
  .note.alarm h3 { color:var(--bad); }
  .note p { margin:0 0 6px; color:var(--ink-2); }
  .note p:last-child { margin-bottom:0; }
  .note .quote { display:block; margin:6px 0; padding:8px 10px; background:var(--panel);
                 border:1px solid var(--line); border-radius:7px; font-size:12.5px;
                 white-space:pre-wrap; word-break:break-word; color:var(--ink);
                 max-height:180px; overflow:auto; }

  .block { margin:0 0 20px; }
  .block > .sec { margin-bottom:8px; }
  .facts { display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--sp-1) 16px; margin:0; }
  .facts dt { color:var(--muted); font-size:12.5px; }
  .facts dd { margin:0; font-size:13px; word-break:break-word; }
  .facts dd .src { color:var(--faint); font-size:11px; margin-left:6px; }

  /* The full command, on demand. Wrapped and bounded: a multi-kilobyte
     base64 blob scrolls inside this box and never stretches the panel. */
  .full { background:var(--sunk); border:1px solid var(--line); border-radius:8px;
          padding:10px 12px; font-size:12.5px; white-space:pre-wrap; word-break:break-all;
          max-height:200px; overflow:auto; margin:0; color:var(--ink-2); }
  .full-head { display:flex; align-items:baseline; gap:var(--sp-3); margin-bottom:6px; }
  .full-head .sec { margin:0; flex:1; }
  .tiny { border:1px solid var(--line-2); background:var(--panel); color:var(--muted);
          border-radius:7px; padding:2px 8px; font:inherit; font-size:11.5px; cursor:pointer; }
  .tiny:hover { border-color:var(--accent); color:var(--accent); }

  /* The live log. It takes the height its column gives it rather than a
     fixed 260px, which was twelve lines on a laptop and twelve lines on a 4K
     display. It still sticks to the bottom only while the reader is already
     there — scrolling up to read something must not be undone by the next
     chunk. */
  .log { background:var(--sunk); border:1px solid var(--line); border-radius:8px;
         padding:10px 12px; font-size:12px; line-height:1.5; overflow:auto;
         white-space:pre-wrap; word-break:break-word; color:var(--ink-2); margin:0; }
  /* The stream says which of its states it is in, in words. "output ended"
     used to be the same sentence whether the job finished or the connection
     died, which is the one distinction a reader cannot afford to miss. */
  .log-bar { display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap;
             margin:0 0 6px; font-size:11.5px; color:var(--muted); }
  .log-state { display:flex; align-items:center; gap:var(--sp-2); font-weight:600; }
  .log-state i { width:6px; height:6px; border-radius:50%; background:var(--faint); flex:none; }
  .log-state.live { color:var(--ready); } .log-state.live i { background:var(--ready); }
  .log-state.paused { color:var(--warn); } .log-state.paused i { background:var(--warn); }
  .log-state.broken { color:var(--bad); } .log-state.broken i { background:var(--bad); }
  .log-tools { margin-left:auto; display:flex; gap:var(--sp-2); align-items:center; }
  /* The wrapper is in the height chain, not beside it. A relatively
     positioned box that sizes to its content lets the pane inside grow
     instead of scroll — and a pane that never overflows is always "at the
     bottom", so follow mode can never pause. Same trap as the output column
     above it; it has to be a constrained flex parent too. */
  .log-wrap { position:relative; display:flex; flex-direction:column; flex:1; min-height:0; }
  /* Jump to live is a real control, not a hint: it names how much has arrived
     while the reader was elsewhere, and it is the way back. */
  .log-jump { position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
              border:0; background:var(--accent); color:#fff; border-radius:100px;
              padding:5px 14px; font:inherit; font-size:12px; font-weight:600; cursor:pointer;
              box-shadow:0 6px 20px -6px rgba(20,22,28,.45); z-index:2; }
  .log-jump:hover { filter:brightness(1.08); }
  .log-note { color:var(--faint); font-style:italic; }

  .sheet { font-size:13.5px; color:var(--ink-2); }
  .sheet h3 { font-size:14px; margin:14px 0 4px; color:var(--ink); font-weight:600; }
  .sheet h3:first-child { margin-top:0; }
  .sheet h4 { font-size:13px; margin:12px 0 4px; color:var(--ink); font-weight:600; }
  .sheet p { margin:0 0 8px; }
  .sheet ul, .sheet ol { margin:0 0 8px; padding-left:20px; }
  .sheet li { margin:2px 0; }
  .sheet code { background:var(--sunk); border-radius:4px; padding:1px 4px; font-size:12px;
                font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; word-break:break-word; }
  .sheet pre { background:var(--sunk); border:1px solid var(--line); border-radius:8px;
               padding:9px 11px; overflow:auto; font-size:12px; margin:0 0 8px;
               font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .sheet blockquote { margin:0 0 8px; padding-left:11px; border-left:2px solid var(--line-2);
                      color:var(--muted); }
  .sheet hr { border:0; border-top:1px solid var(--line); margin:12px 0; }

  .jrow { display:flex; gap:var(--sp-2); align-items:baseline; font-size:12.5px; width:100%;
          text-align:left; background:none; border:0; color:inherit; font-family:inherit;
          padding:5px 6px; border-radius:7px; cursor:pointer; }
  .jrow:hover { background:var(--hover); }
  .jst { font-size:11.5px; font-weight:600; flex:none; width:62px; }
  .jst.ok { color:var(--ready); } .jst.bad { color:var(--bad); } .jst.warn { color:var(--warn); }
  .jwho { color:var(--ink-2); flex:none; }
  .jcmd { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }

  .agewarn { color:var(--warn); font-size:12.5px; margin-top:8px; }
  .linkish { background:none; border:0; padding:0; font:inherit; color:var(--accent);
             cursor:pointer; text-align:left; }
  .linkish:hover { text-decoration:underline; }

  /* The identity control is a footnote, not a headline: it is set once and
     never touched again, so it must not compete with the fleet. */
  .who-bar { margin-top:30px; padding-top:16px; border-top:1px solid var(--line);
             display:flex; gap:var(--sp-2); align-items:center; flex-wrap:wrap;
             font-size:13px; color:var(--muted); }
  .who-bar input { flex:0 1 240px; }
  .who-bar button { border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2);
                    border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }

  input { background:var(--panel); color:var(--ink); border:1px solid var(--line-2);
          border-radius:8px; padding:8px 11px; font:inherit; }
  input:focus-visible, button:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* The only ambient motion on this page, and only for a reader who has not asked
     for less of it: a row and a portrait ease between their colours instead
     of snapping. Nothing here moves on its own, and nothing moves at all
     under prefers-reduced-motion. */
  @media (prefers-reduced-motion: no-preference) {
    .row, .open, .portrait { transition:background-color .15s ease, border-color .15s ease; }
  }

  #gate { padding:64px 24px; max-width:400px; margin:0 auto; }
  #gate h2 { font-size:16px; margin:0 0 6px; font-weight:600; }
  #gate p { color:var(--muted); font-size:13px; margin:0 0 18px; }
  #gate form { display:flex; gap:var(--sp-2); }
  #gate input { flex:1; }
  #gate button { background:var(--ink); color:var(--bg); border:0; border-radius:8px;
                 padding:8px 15px; font:inherit; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<header>
  <span class="brand">
    <!-- The mark, inlined: two jaws holding one token. currentColor so it
         belongs to the text in either palette, and no external request. -->
    <svg width="20" height="20" viewBox="0 0 64 64" role="img" aria-label="resource controller">
      <path d="M24 4H4v56h20v-8H12V12h12Z" fill="currentColor" opacity=".55"/>
      <path d="M40 4h20v56H40v-8h12V12H40Z" fill="currentColor" opacity=".55"/>
      <circle cx="32" cy="32" r="13" fill="var(--accent)"/>
    </svg>
    <h1>resource controller</h1>
  </span>
  <nav class="places" id="places" aria-label="Views">
    <button type="button" data-place="fleet" aria-current="page">The day</button>
    <button type="button" data-place="running">Running now<span class="n" id="placesRunning"></span></button>
  </nav>
  <span id="role" class="hide"></span>
  <span id="act" aria-live="polite"></span>
  <span id="err"></span>
  <span class="live" id="live"><span class="dot"></span><span id="liveText"></span></span>
</header>

<div id="gate">
  <h2>Connect</h2>
  <p>Paste a client token. It stays in this tab and is never written to disk.</p>
  <form id="gateForm">
    <input id="token" type="password" autocomplete="off" placeholder="client token" required>
    <button type="submit">Connect</button>
  </form>
</div>

<main id="app" class="hide">
  <section id="fleetOverview">
    <div class="fleet-head">
      <div>
        <p class="fleet-statement" id="fleetSummary"></p>
        <div class="fleet-facts" id="fleetFacts"></div>
      </div>
      <div class="fleet-head-controls">
        <div class="day-window hide" id="dayWindow" role="group" aria-label="Time window">
          <button type="button" data-hours="6" aria-pressed="false">6h</button>
          <button type="button" data-hours="8" aria-pressed="true">8h</button>
          <button type="button" data-hours="12" aria-pressed="false">12h</button>
          <button type="button" data-hours="24" aria-pressed="false">Day</button>
        </div>
        <div class="fleet-mode" id="fleetMode" role="group" aria-label="Fleet display">
          <button type="button" data-mode="day" aria-pressed="true">Day</button>
          <button type="button" data-mode="bays" aria-pressed="false">Bays</button>
          <button type="button" data-mode="matrix" aria-pressed="false">Matrix</button>
        </div>
      </div>
    </div>
    <div class="overview-grid" id="overviewGrid">
      <div class="machine-room" id="machineRoom"></div>
      <aside class="attention hide" id="attentionRegion" aria-labelledby="attentionTitle">
        <div class="attention-head"><h2 id="attentionTitle">Needs attention</h2></div>
        <div id="attentionItems"></div>
        <div class="changes">
          <h3 class="sec">Changes in this tab</h3>
          <div class="feed" id="feed"></div>
          <p class="feed-note">The controller keeps no event history to replay, so this starts
            fresh on every reload.</p>
        </div>
      </aside>
    </div>
    <section class="work-strip hide" id="workStrip">
      <h2 class="sec">Queued and active work</h2>
      <div id="work"></div>
    </section>
  </section>
  <form class="who-bar" id="whoBar">
    <label for="who">You are</label>
    <input id="who" type="text" autocomplete="off" placeholder="alice@lab">
    <button type="submit">Set</button>
    <span id="whoHint"></span>
  </form>
  <section id="runningView" class="hide" aria-labelledby="runningHeading">
    <div class="running-head">
      <h2 id="runningHeading" tabindex="-1">Running now</h2>
      <p class="running-sub" id="runningSub"></p>
    </div>
    <div id="runningList"></div>
  </section>
  <section id="workspace" class="hide" aria-labelledby="workspaceHeading">
    <div class="workspace-head">
      <button id="workspaceBack" class="iconbtn" type="button" title="back to fleet">&#8592;</button>
      <div>
        <span id="workspaceKind" class="workspace-kind"></span>
        <h2 id="workspaceHeading" tabindex="-1"></h2>
      </div>
    </div>
    <!-- Three children, and the third is the point: the output pane holds a
         live stream and a reader's scroll position, so it must never be
         removed from the document. A refresh rebuilds the first two and
         leaves it alone. -->
    <div id="workspaceBody" class="workspace-body">
      <div id="workspaceLife"></div>
      <div id="workspaceMain"></div>
      <div id="workspaceOutput" class="workspace-output hide"></div>
    </div>
  </section>
</main>

<!-- The device glyphs: four drawings, and deliberately only four.

     They live here as static markup and are put on the page by cloning —
     never by assembling a string of it — for the same reason nothing else
     on this page is assembled from a string: the moment markup is built at
     runtime, one of the values in it is a device ID or a label a host
     wrote. Cloning a template moves no text at all.

     They are drawn in one 48-unit box and used at two sizes, they carry no
     colour of their own (see .glyph in the stylesheet, which is where the
     three variables they use are bound to the page's tokens), and they are
     aria-hidden: the state a glyph shows is always said in words by the
     pill beside it.

     Four is the whole set. Which one a device gets is decided by glyphKind()
     from the labels the controller was given, so a box nobody here has
     heard of still renders — as the generic die. Adding a fifth drawing is
     a design decision; adding a fifth machine is not. -->
<template id="glyph-discrete">
  <!-- A discrete card: a board with a fan and a memory bank, the shape of
       a thing that slots into a chassis. -->
  <svg viewBox="0 0 48 48" class="glyph" aria-hidden="true" focusable="false">
    <rect class="ink" x="5" y="12" width="38" height="26" rx="3"/>
    <circle class="mark" cx="17" cy="25" r="7"/>
    <path class="mark" d="M17 18v14M10 25h14"/>
    <rect class="core-soft" x="29" y="19" width="9" height="12" rx="1.5"/>
    <path class="faint" d="M12 38v5M36 38v5" stroke-linecap="round"/>
  </svg>
</template>
<template id="glyph-module">
  <!-- A module: a square carrier board with its die in the middle and a
       connector along two edges, the shape of a Jetson. -->
  <svg viewBox="0 0 48 48" class="glyph" aria-hidden="true" focusable="false">
    <rect class="ink" x="9" y="9" width="30" height="30" rx="4"/>
    <rect class="core-soft" x="17" y="17" width="14" height="14" rx="2"/>
    <rect class="mark" x="17" y="17" width="14" height="14" rx="2"/>
    <path class="faint" d="M15 9V4M24 9V4M33 9V4M15 44v-5M24 44v-5M33 44v-5" stroke-linecap="round"/>
  </svg>
</template>
<template id="glyph-fault">
  <!-- The same outline with its die replaced by an alert mark: a device
       that is out of the pool reads as wrong by SHAPE, at any size, in
       either palette, and with the colour taken away entirely. -->
  <svg viewBox="0 0 48 48" class="glyph" aria-hidden="true" focusable="false">
    <rect class="ink" x="9" y="9" width="30" height="30" rx="4"/>
    <path class="mark hi" d="M24 17v9M24 30.5v.5" stroke-linecap="round"/>
    <path class="faint" d="M15 9V4M24 9V4M33 9V4M15 44v-5M24 44v-5M33 44v-5" stroke-linecap="round"/>
  </svg>
</template>
<template id="glyph-die">
  <!-- The fallback: a bare die with pins on all four sides. It says "a
       processor, and nothing was reported about which" — which is exactly
       true of any device whose labels match none of the rules. -->
  <svg viewBox="0 0 48 48" class="glyph" aria-hidden="true" focusable="false">
    <rect class="ink" x="9" y="9" width="30" height="30" rx="5"/>
    <rect class="core" x="17" y="17" width="14" height="14" rx="2"/>
    <path class="faint" d="M18 9V4M30 9V4M18 44v-5M30 44v-5M9 18H4M9 30H4M44 18h-5M44 30h-5"
          stroke-linecap="round"/>
  </svg>
</template>

<script src="/dashboard/anime.umd.min.js"></script>
<script>
(function () {
  // Credentials, in one place.
  //
  // token is the CLIENT token: it reads state and kills this operator's own
  // jobs. It is the only thing that survives a reload, in sessionStorage
  // (tab-scoped, gone with the tab). Nothing stronger is ever kept.
  //
  // The admin token — which returns a device to the pool fleet-wide — is
  // never held here: clearDevice() asks for it at the moment of the click,
  // hands it to exactly one request, and drops it before any callback could
  // capture it. The credential resident in this browser is always the weaker
  // of the two.
  //
  // identity is not a credential. It is the submitter name a kill is sent
  // as, the same string `rc kill --as` sends. Held in memory only, so a
  // reload keeps the connection and forgets who you are. Note what the
  // server's check is: it compares the submitter the client claims, so this
  // guards against killing the wrong job by accident — it does not
  // authenticate who is asking.
  var token = sessionStorage.getItem("rc_token") || "";
  // role is what THIS token can do, straight from /v1/whoami. It decides
  // whether the admin actions are offered directly or ask for a second
  // token at the moment of the click. It is not itself a permission: every
  // route still checks the role server-side, so a tampered value here buys
  // nothing but a button that gets refused.
  var role = "";
  var identity = "";

  var latest = null;        // the last /v1/state response
  var deviceIndex = {};     // device id -> DeviceView, from the last state
  var jobIndex = {};        // job id -> job, from every state and every fetch
  var prevDevices = null;   // device id -> {state, holder, kind}, for the feed diff
  var describes = {};       // device id -> /v1/devices/{id}/describe response
  // The working day. /v1/jobs has served this since job history landed and
  // this page has never once asked for it — so every previous version of the
  // dashboard could only ever draw an instant. Every bar on the timeline, and
  // every utilization figure derived from one, comes from here.
  var history = [];         // recent jobs from /v1/jobs, newest first
  var historyFetchedAt = 0; // this browser's clock, used only as a delta

  var gate = document.getElementById("gate");
  var app = document.getElementById("app");
  var err = document.getElementById("err");
  var act = document.getElementById("act");
  var pollTimer = null, freshTimer = null, es = null, lastFetchAt = null, nudgePending = false;

  // ---- the controller's clock -------------------------------------------
  //
  // Every age and wait on the wire is computed by the controller, and
  // client_api.go says exactly why: a reader's clock must not be able to make
  // a stuck queue look fresh. The timeline is the first thing on this page
  // that places ABSOLUTE timestamps on a shared axis — a job started at
  // 13:06 — so drawing it against Date.now() would reintroduce that exposure
  // for the whole chart rather than for a single field.
  //
  // So the axis is anchored on the controller instead. Every response already
  // carries a Date header, which is the controller's own clock and costs no
  // API change. The offset between it and this browser is recorded on each
  // read, and every position, tick and duration is derived from the corrected
  // value. A browser an hour behind draws the same picture as one that is
  // right.
  //
  // The header has one-second granularity and is a network hop old by the
  // time it is read. The smallest unit on the chart is a minute, so neither
  // matters. This is an anchor, not a synchronisation protocol.
  var clockSkewMs = 0;      // controller clock minus this browser's clock

  function anchorClock(response) {
    var header = response.headers.get("Date");
    if (!header) return false;
    var at = Date.parse(header);
    if (!isFinite(at)) return false;
    clockSkewMs = at - Date.now();
    return true;
  }

  // Now, as the controller would say it.
  function controllerNow() { return Date.now() + clockSkewMs; }

  // One RFC 3339 timestamp from the API as milliseconds. Parsing a server
  // timestamp is not the mistake the comment above guards against; comparing
  // one to an unanchored browser clock is. Everything here is compared
  // against controllerNow.
  function instant(ts) {
    if (!ts) return NaN;
    return Date.parse(ts);
  }

  // Where one job sits on an axis, as percentages of the window. Clipped at
  // both ends so a run that began before the window opened, or has not ended
  // at all, still draws — and floored to a visible width so a four-second job
  // is a mark rather than nothing. Returns null when the job does not touch
  // the window at all.
  function barSpan(job, fromMs, toMs, nowMs) {
    var span = toMs - fromMs;
    if (span <= 0) return null;
    var a = instant(job.started_at);
    if (!isFinite(a)) return null;
    var b = job.finished_at ? instant(job.finished_at) : nowMs;
    if (!isFinite(b) || b < a) b = a;
    if (b <= fromMs || a >= toMs) return null;
    var left = (Math.max(a, fromMs) - fromMs) / span * 100;
    var width = (Math.min(b, toMs) - fromMs) / span * 100 - left;
    if (width < 0.35) width = 0.35;
    if (left + width > 100) left = 100 - width;
    return {
      left: left,
      width: width,
      clippedStart: a < fromMs,
      clippedEnd: b > toMs
    };
  }

  // How many seconds of a window a device actually spent held. Derived from
  // the same job records the bars are drawn from, which is why utilization
  // needs no endpoint and no stored metric. Overlapping leases are merged
  // rather than summed: a device cannot be more than fully busy, and a
  // reconciled lease can legitimately overlap the one it replaced.
  function busySeconds(jobs, deviceID, fromMs, toMs, nowMs) {
    var spans = [];
    for (var i = 0; i < jobs.length; i++) {
      var j = jobs[i];
      if (j.device_id !== deviceID) continue;
      var a = instant(j.started_at);
      if (!isFinite(a)) continue;
      var b = j.finished_at ? instant(j.finished_at) : nowMs;
      if (!isFinite(b) || b < a) continue;
      var lo = Math.max(a, fromMs), hi = Math.min(b, toMs);
      if (hi > lo) spans.push([lo, hi]);
    }
    spans.sort(function (x, y) { return x[0] - y[0]; });
    var total = 0, start = -1, end = -1;
    for (var k = 0; k < spans.length; k++) {
      if (spans[k][0] > end) {
        if (end > start) total += end - start;
        start = spans[k][0];
        end = spans[k][1];
      } else if (spans[k][1] > end) {
        end = spans[k][1];
      }
    }
    if (end > start) total += end - start;
    return Math.round(total / 1000);
  }

  // ---- small DOM helpers ------------------------------------------------
  //
  // Everything on this page is built with these. There is no innerHTML
  // anywhere in this file and there must never be one: a device ID, a
  // command line, a submitter, a usage sheet and a server error string are
  // all chosen by somebody else, and the only way to be sure they are read
  // as text is to make them text nodes.

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function txt(s) { return document.createTextNode(s); }

  function button(cls, text, onClick) {
    var b = el("button", cls, text);
    b.type = "button";
    b.addEventListener("click", onClick);
    return b;
  }

  function fail(m) { err.textContent = m; }
  function actOK(m) { act.textContent = m; act.className = ""; }
  function actFail(m) { act.textContent = m; act.className = "bad"; }

  // ---- formatting -------------------------------------------------------
  //
  // Every duration here takes a number the SERVER computed. This page never
  // measures an age against its own clock: a browser with a skewed clock
  // must not be able to make a month-old label read as fresh, or a stuck
  // queue read as new. The two exceptions are the header's "updated Ns ago"
  // and the activity feed's timestamps, which are both deltas between two
  // readings of this browser's own clock and so are immune by construction.

  function ago(s) {
    if (s < 0) return "in the future?";
    if (s < 60) return s + "s";
    if (s < 3600) return Math.floor(s / 60) + "m";
    if (s < 86400) return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
    return Math.floor(s / 86400) + "d " + Math.floor((s % 86400) / 3600) + "h";
  }

  // An absolute instant the server recorded, shown in the reader's own
  // timezone. This is a rendering of a server value, not a comparison
  // against the browser clock, so it carries none of the skew risk that
  // computing an age here would.
  function clockTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleString();
  }

  // Raw byte counts are the single least readable thing the probes produce:
  // disk_free_bytes=59138863104 tells nobody anything at a glance.
  function bytes(n) {
    var u = ["B", "KiB", "MiB", "GiB", "TiB", "PiB"], i = 0, v = Number(n);
    if (!isFinite(v)) return String(n);
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)) + " " + u[i];
  }

  function prettyValue(key, value) {
    if (/_bytes$/.test(key)) return bytes(value);
    return value;
  }

  function prettyKey(key) { return key.replace(/_bytes$/, "").replace(/_/g, " "); }

  // clip bounds what we put in the DOM at all, rather than relying on CSS
  // to hide the overflow. Some commands on this fleet are multi-kilobyte
  // base64 blobs; a row must not carry one as a text node just to ellipsis
  // it away, and no list on this page is a place to read one anyway.
  function clip(s, n) {
    s = String(s === undefined || s === null ? "" : s);
    return s.length > n ? s.slice(0, n) + "…" : s;
  }

  function labelMap(v) {
    var m = {};
    ((v.device && v.device.labels) || []).forEach(function (l) {
      if (!(l.key in m) || l.source === "detected") m[l.key] = l.value;
    });
    return m;
  }

  // The one-line "what is this box" summary. Two or three facts that bear on
  // a scheduling decision, not the nine chips that would dominate the row.
  function specLine(v) {
    var m = labelMap(v), bits = [];
    if (m.gpu_model) bits.push(m.gpu_model);
    else if (m.vendor) bits.push(m.vendor);
    if (m.vram) bits.push(m.vram);
    // Deliberately NOT disk_free_bytes: it is a HOST fact, so repeating it on
    // every device of that host is the same number four times. It rides the
    // host heading instead.
    return bits.join(" · ");
  }

  // Facts that belong to the machine rather than to one of its devices, so
  // they are stated once per host instead of once per row.
  function hostSummary(views) {
    var bits = [views.length + (views.length === 1 ? " device" : " devices")];
    var m = labelMap(views[0]);
    if (m.disk_free_bytes) bits.push(bytes(m.disk_free_bytes) + " free");
    if (m.cpus) bits.push(m.cpus + " CPUs");
    return bits.join(" · ");
  }

  // ---- which machine is this ---------------------------------------------
  //
  // A glyph is chosen from what the controller was TOLD about the hardware
  // and from nothing else. Not from the host name: this fleet is three boxes
  // today, and the fourth has to render on the day its worker registers,
  // from a machine nobody wrote code for. A hostname list would mean every
  // new box arrives invisible until someone edits this file, which is the
  // failure mode worth designing out.
  //
  // So: gather the label values that describe hardware, and match words in
  // them. Both label sources count — a `gpu_model` an operator declared in
  // the worker's config and a `model` nvidia-smi detected say the same kind
  // of thing — and `kernel` is in the list on purpose: it is the one fact a
  // Jetson reports (…-tegra) on a box that has no nvidia-smi at all, which
  // is exactly the case orin is.
  //
  // Nothing matches? The generic die. That fallback is the point of having
  // only four drawings: adding a fourth box needs no drawing, and a fleet
  // this code has never heard of still renders as something.
  var HARDWARE_KEYS = ["gpu_model", "model", "product", "board", "platform",
                       "soc", "chassis", "form_factor", "arch", "vendor", "kernel"];

  // Read in order; first match wins. To teach it a new shape, add a word —
  // not a hostname, and not a fifth glyph.
  var GLYPH_RULES = [
    { kind: "module", re: /\b(jetson|orin|thor|xavier|tegra|igx|agx)\b/ },
    { kind: "discrete", re: /\b(g[bh]\d+|dgx|spark|grace|blackwell|hopper|ampere|rtx|gtx|geforce|quadro|tesla|titan|radeon|instinct|[ahlbvtp]\d{2,3}|[tl]4)\b/ }
  ];

  function glyphKind(v) {
    // Out of the pool outranks what the hardware is: the reader who opens
    // this page because something is wrong needs the wrong thing to be the
    // shape they see, not a correctly-drawn Jetson.
    if (v.device.state === "unhealthy") return "fault";
    var m = labelMap(v), text = "";
    HARDWARE_KEYS.forEach(function (k) {
      if (m[k]) text += " " + String(m[k]).toLowerCase();
    });
    for (var i = 0; i < GLYPH_RULES.length; i++) {
      if (GLYPH_RULES[i].re.test(text)) return GLYPH_RULES[i].kind;
    }
    return "die";
  }

  // The glyph is CLONED from a <template> in this document, never built
  // from a string of markup: see the note beside the templates. Colour
  // arrives as a class the stylesheet resolves against the state, so no
  // colour value is chosen here.
  function glyphFor(v, size) {
    var tpl = document.getElementById("glyph-" + glyphKind(v));
    var node = tpl.content.firstElementChild.cloneNode(true);
    // setAttribute, not .className: on an SVG element className is an
    // SVGAnimatedString and assigning to it silently does nothing.
    node.setAttribute("class", "glyph glyph-" + size + " " + v.device.state);
    return node;
  }

  // The portrait's line about the hardware — a little fuller than the
  // board's, because the panel has the room. Every value is clipped: a
  // label is whatever a probe on the host printed, and a probe that prints
  // a paragraph must not stretch this panel.
  function portraitSpec(v) {
    var m = labelMap(v), bits = [];
    if (m.gpu_model) bits.push(clip(m.gpu_model, 40));
    else if (m.model) bits.push(clip(m.model, 40));
    else if (m.vendor) bits.push(clip(m.vendor, 40));
    if (m.vram) bits.push(clip(m.vram, 16) + " VRAM");
    if (m.cpus) bits.push(clip(m.cpus, 8) + " CPUs");
    if (!bits.length) return "Nothing has reported what this hardware is.";
    return bits.join(" · ");
  }

  // How much of this device is spoken for. rc hands out a device whole —
  // there is no half a GPU — so the bar is full or empty, EXCEPT while a
  // job with a time limit runs, where it is how far through that limit the
  // job has got. That is the one number worth watching during a run, and it
  // is measured by the controller like every other age on this page; when
  // there is no limit there is no number, and the bar says only "claimed".
  function claim(v) {
    var d = v.device;
    if (d.state === "unhealthy") {
      return { pct: 100, tone: "unhealthy", what: "out of the pool", when: "" };
    }
    if (v.holder) {
      var job = jobIndex[v.job_id];
      var limit = job && job.max_runtime_seconds;
      var elapsed = v.elapsed_seconds || 0;
      return {
        // Floored at a sliver so that "a job is running" is never drawn as
        // an empty bar in its first seconds.
        pct: limit ? Math.max(3, Math.min(100, Math.round(elapsed / limit * 100))) : 100,
        tone: "busy",
        what: (v.kind === "hold" ? "held by " : "running work for ") + clip(v.holder, 40),
        when: limit ? ago(elapsed) + " of " + ago(limit) : ago(elapsed)
      };
    }
    if (d.state === "unknown") {
      return { pct: 0, tone: "unknown", what: "nothing is reporting for it",
               when: "quiet " + ago(v.heartbeat_age_seconds) };
    }
    return { pct: 0, tone: "ready", what: "nothing is using it", when: "ready for work" };
  }

  // A job's command as one string, bounded. `hold` has no command a
  // submitter chose — the worker runs its own sleeper — so it is described
  // rather than quoted.
  function commandText(job) {
    if (!job) return "";
    if (job.kind === "hold") return "hold" + (job.reason ? " — " + job.reason : "");
    return (job.command || []).join(" ");
  }

  // ---- plain language ---------------------------------------------------
  //
  // The controller's own vocabulary — unhealthy, quarantine_reason,
  // lease, worker_lost — is precise and is the wrong thing to put in front
  // of a reader who is trying to work out whether a GPU is usable. Every
  // internal term is translated exactly once, here, and nowhere on this page
  // is a raw state name or reason category printed.

  function stateWord(state) {
    if (state === "unhealthy") return "out of the pool";
    if (state === "unknown") return "not reporting";
    if (state === "busy") return "in use";
    if (state === "ready") return "free";
    return String(state || "unknown");
  }

  function jobStateWord(state) {
    switch (state) {
      case "queued": return "waiting for a device";
      case "assigned": return "starting";
      case "running": return "running";
      case "succeeded": return "finished";
      case "failed": return "failed";
      case "killed": return "stopped";
      case "lost": return "lost";
    }
    return String(state || "");
  }

  // The same states, short enough for a list column. "waiting for a device"
  // is the right sentence at the top of a job's own panel and the wrong one
  // wrapped over three lines in a history row.
  function jobStateShort(state) {
    if (state === "queued") return "queued";
    return jobStateWord(state);
  }

  function jobStateClass(state) {
    if (state === "succeeded") return "ok";
    if (state === "failed" || state === "lost") return "bad";
    if (state === "killed") return "warn";
    return "";
  }

  // The four categories the controller records when it takes a device out
  // of the pool (internal/store/reaper.go). The API hands the dashboard ONE
  // string for both: the operator-facing detail when there is one, and the
  // bare category when there is not — so a reason that is exactly one of
  // these four words is a category, and anything else is free text a host
  // wrote. That is the only signal available without a server change, and
  // it is a safe one: no host writes a detail that is exactly "fault" and
  // nothing else, and if one did, the sentence shown would still be true.
  var CATEGORIES = {
    fault: {
      headline: "The host reported a problem with this device.",
      body: "The worker took it out of the pool itself — a check failed, or something it " +
            "runs before a job would not start.",
      advice: "Nothing was recorded about what failed. The worker's log on this host will " +
              "say. A reboot does not clear this one: someone has to look."
    },
    worker_lost: {
      headline: "The host stopped reporting.",
      body: "The controller lost contact with the worker while this device was claimed, so " +
            "the device was held back rather than handed to somebody else — whatever was " +
            "running on it may still be running.",
      advice: "If the host has since rebooted, the device comes back on its own once the " +
              "worker registers again. Otherwise check that the worker is up on this host."
    },
    lease_expired: {
      headline: "The claim on this device ran out.",
      body: "Whoever held it stopped renewing, and nothing confirmed the work had finished, " +
            "so the device was held back in case a process is still using it.",
      advice: "Check the host for a leftover process holding the device, then return it to " +
              "the pool. A reboot of the host clears this on its own."
    },
    registration: {
      headline: "The worker restarted with work still in flight.",
      body: "It came back without the job it had been running, so the device was held back " +
            "in case that work is still on the machine.",
      advice: "Confirm nothing is left running on the host, then return the device to the " +
              "pool. A reboot of the host clears this on its own."
    }
  };

  // The prefix internal/worker/verify.go stamps on a fault it raised after
  // a job — worth telling apart, because it means the last job finished
  // fine and the device did not.
  var VERIFY_PREFIX = "verify failed: ";

  // explain turns whatever the API put in quarantine_reason into a headline,
  // an optional verbatim quote of what the host said, and what to do next.
  function explain(reason) {
    reason = String(reason || "");
    if (!reason) {
      return {
        headline: "No reason was recorded.",
        body: "This device was taken out of the pool before the controller kept reasons, " +
              "or by something that did not give one.",
        advice: "Check the host, then return it to the pool if it looks healthy.",
        quote: ""
      };
    }
    if (CATEGORIES[reason]) {
      var c = CATEGORIES[reason];
      return { headline: c.headline, body: c.body, advice: c.advice, quote: "" };
    }
    if (reason.indexOf(VERIFY_PREFIX) === 0) {
      return {
        headline: "A check after the last job found this device was not clean.",
        body: "The job itself finished; the device did not pass the check that runs " +
              "afterwards, so it was held back instead of being handed on.",
        advice: "Usually a leftover process still holding the card. Deal with it on the " +
                "host, then return the device to the pool.",
        quote: reason.slice(VERIFY_PREFIX.length)
      };
    }
    return {
      headline: "The host reported a problem with this device.",
      body: "The worker took it out of the pool itself and said why:",
      advice: "A reboot does not clear this one — deal with what the host reported, then " +
              "return the device to the pool.",
      quote: reason
    };
  }

  // ---- server calls -----------------------------------------------------

  function authHeaders() { return { Authorization: "Bearer " + token }; }

  function serverError(r) {
    return r.text().then(function (body) {
      var message = "";
      try {
        var parsed = JSON.parse(body);
        if (parsed && parsed.error) {
          message = parsed.message ? parsed.error + ": " + parsed.message : parsed.error;
        }
      } catch (e) { /* not JSON: fall through to the status */ }
      return message || ("HTTP " + r.status);
    }, function () { return "HTTP " + r.status; });
  }

  function killJob(job) {
    var short = job.id.slice(0, 8);
    var what = "Kill job " + short + " on " + (job.device_id || "its device") + "?";
    if (job.submitter !== identity) {
      what += "\n\nIt was submitted by " + job.submitter + ", not by " + identity +
        " — the controller will refuse this unless you hold an admin token.";
    }
    if (!window.confirm(what)) return;
    actOK("killing " + short + "…");
    fetch("/v1/jobs/" + encodeURIComponent(job.id) + "/kill", {
      method: "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ submitter: identity })
    }).then(function (r) {
      if (r.ok) { actOK("kill requested for " + short); refresh(); return; }
      return serverError(r).then(actFail);
    }).catch(function (e) { actFail(e.message); });
  }

  // The only admin-authenticated calls this page makes, and the only place an
  // admin token ever exists in this tab. Read at the click, used for one
  // request, dropped on the next line — before the response arrives, so none
  // of the callbacks below can close over a live value. Never stored, never
  // returned, never held anywhere that outlives this call.
  function clearDevice(id, reason) {
    var msg = "Return " + id + " to the pool?";
    if (reason) msg += "\n\nIt was taken out because:\n" + explain(reason).headline;
    msg += "\n\nThis needs an admin token, and only works if nothing holds the device.";
    if (!window.confirm(msg)) return;

    // An admin session already holds a token that can do this, so asking for
    // a second one would be ceremony without a security gain — the stronger
    // credential is already resident either way. A client session still
    // prompts, so the token in storage stays the weaker one for anyone who
    // connected with a client token.
    if (role === "admin") {
      actOK("clearing " + id + "…");
      adminFetch("/v1/devices/" + encodeURIComponent(id) + "/clear", "POST", token,
        "cleared " + id);
      return;
    }

    var admin = window.prompt("Admin token to clear " + id + " (used once, never stored)");
    if (admin === null) return;
    admin = admin.trim();
    if (!admin) { actFail("no admin token given; nothing was sent"); return; }

    actOK("clearing " + id + "…");
    var pending = fetch("/v1/devices/" + encodeURIComponent(id) + "/clear", {
      method: "POST",
      headers: { Authorization: "Bearer " + admin }
    });
    admin = null; // dropped synchronously, while the request is still in
                  // flight: the callbacks below see null, never a token
    pending.then(function (r) {
      if (r.ok) { actOK("cleared " + id); refresh(); return; }
      // A refusal is reported in the controller's own words rather than as
      // a success: device_not_cleared means something still holds the
      // device, and telling an operator it worked would be a lie they act
      // on.
      return serverError(r).then(actFail);
    }).catch(function (e) { actFail(e.message); });
  }

  // adminFetch is the admin-session path: one request with the token already
  // in hand, and the controller's own words on failure.
  function adminFetch(path, method, bearer, okMessage) {
    fetch(path, { method: method, headers: { Authorization: "Bearer " + bearer } })
      .then(function (r) {
        if (r.ok) { actOK(okMessage); refresh(); return; }
        return serverError(r).then(actFail);
      }).catch(function (e) { actFail(e.message); });
  }

  // retireDevice removes a device from the fleet for good. Admin-only, and
  // the confirmation spells out what survives (job history) and what does
  // not, because unlike a kill there is nothing to undo it from.
  function retireDevice(id) {
    var msg = "Retire " + id + "?\n\n" +
      "It is removed from the fleet. Job history is kept.\n\n" +
      "If a worker still declares this device, it will come back on that " +
      "worker's next registration — remove it from the worker's config first.";
    if (!window.confirm(msg)) return;
    if (role === "admin") {
      actOK("retiring " + id + "…");
      adminFetch("/v1/devices/" + encodeURIComponent(id), "DELETE", token, "retired " + id);
      return;
    }
    var adminToken = window.prompt("Admin token to retire " + id + " (used once, never stored)");
    if (adminToken === null) return;
    adminToken = adminToken.trim();
    if (!adminToken) { actFail("no admin token given; nothing was sent"); return; }
    actOK("retiring " + id + "…");
    var retiring = fetch("/v1/devices/" + encodeURIComponent(id), {
      method: "DELETE", headers: { Authorization: "Bearer " + adminToken }
    });
    adminToken = null; // same discipline as the clear path above
    retiring.then(function (r) {
      if (r.ok) { actOK("retired " + id); closeWorkspace(); refresh(); return; }
      return serverError(r).then(actFail);
    }).catch(function (e) { actFail(e.message); });
  }

  // ---- activity feed ----------------------------------------------------
  //
  // The controller has no event history to replay: /v1/events is a live
  // stream of "something changed" nudges and nothing persists them, so this
  // feed can only ever cover the time the page has been open. It says so
  // under the list rather than pretending otherwise.
  //
  // Timestamps are this browser's own clock at the moment an event was
  // observed, and are only ever rendered as a delta against that same clock
  // — the one measurement a skewed clock cannot corrupt. Server-stamped
  // instants are not mixed in.

  var feed = [];
