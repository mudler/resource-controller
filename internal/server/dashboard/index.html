    entry.fill.className = "run-fill" + (soon ? " soon" : entry.mine ? " mine" : "");
    entry.elapsed.textContent = "running " + ago(elapsed);
    entry.remaining.className = "r" + (soon ? " soon" : "");
    entry.remaining.textContent = remaining === null ? "runs until released"
      : remaining <= 0 ? "past its limit" : ago(remaining) + " left";
  }

  function runCard(job, nowMs) {
    var view = job.device_id ? deviceIndex[job.device_id] : null;
    var elapsed = runElapsedSeconds(job, view, nowMs);
    var limit = job.max_runtime_seconds || 0;
    var remaining = limit ? limit - elapsed : null;
    var soon = remaining !== null && remaining <= 900;
    var mine = job.submitter && job.submitter === identity;
    var card = el("div", "run");

    var top = el("div", "run-top");
    top.appendChild(el("span", "id mono", job.id.slice(0, 8)));
    top.appendChild(el("span", "who", job.submitter || "someone"));
    if (job.device_id) {
      top.appendChild(button("linkish mono", job.device_id, function () { openDevice(job.device_id); }));
    }
    if (job.kind === "hold") top.appendChild(el("span", "pill busy", "hold"));
    var open = button("act run-open", "Open", function () { openJob(job.id); });
    open.setAttribute("data-workspace-kind", "job");
    open.setAttribute("data-workspace-id", job.id);
    top.appendChild(open);
    card.appendChild(top);

    var meter = el("div", "run-meter");
    var track = el("div", "run-track");
    var fill = el("div", "run-fill" + (soon ? " soon" : mine ? " mine" : ""));
    fill.style.width = (limit ? Math.min(100, elapsed / limit * 100) : 12) + "%";
    if (!limit) fill.style.opacity = ".4";
    track.appendChild(fill);
    meter.appendChild(track);
    var meta = el("div", "run-meta");
    var elapsedNode = el("span", null, "running " + ago(elapsed));
    var remainingNode = el("span", "r" + (soon ? " soon" : ""),
      remaining === null ? "runs until released"
        : remaining <= 0 ? "past its limit" : ago(remaining) + " left");
    meta.appendChild(elapsedNode);
    meta.appendChild(el("span", null, limit ? "limit " + ago(limit) : "no limit set"));
    meta.appendChild(remainingNode);
    meter.appendChild(meta);
    card.appendChild(meter);

    var entry = {
      root: card, fill: fill, elapsed: elapsedNode, remaining: remainingNode,
      mine: !!mine, abort: function () {}
    };

    if (job.kind === "hold") {
      card.appendChild(el("div", "run-note",
        "A hold runs nothing, so it produces no output." +
        (job.reason ? " Taken for " + job.reason + "." : "")));
    } else if (job.stdio === "tty" || job.stdio === "pipe") {
      card.appendChild(el("div", "run-note",
        "This job's output goes straight to whoever attached to it, not to the controller."));
    } else {
      var tail = el("div", "run-tail mono", "waiting for output…");
      card.appendChild(tail);
      startRunTail(job.id, tail, entry);
    }
    return entry;
  }

  // ---- the life of one run ----------------------------------------------
  //
  // Geometry only, so it can be reasoned about and tested without a document.
  // A job has a shape the fleet chart cannot show: it waited, then it ran, and
  // if it declared max_runtime_seconds there is a moment the controller will
  // stop it. That last one is a stored field, so it is a fact rather than a
  // projection.
  function lifeSegments(job, nowMs) {
    var sub = instant(job.submitted_at);
    if (!isFinite(sub)) return null;
    var start = instant(job.started_at);
    var hasStart = isFinite(start);
    var fin = job.finished_at ? instant(job.finished_at) : NaN;
    var done = isFinite(fin);
    var running = hasStart && !done;
    var end = done ? fin : nowMs;
    if (hasStart && end < start) end = start;
    var limitMs = (job.max_runtime_seconds || 0) * 1000;
    var cap = running && limitMs ? start + limitMs : null;
    var edge = cap !== null ? cap : end;
    var to = sub + Math.max(60000, edge - sub) * 1.04;
    function pct(ms) { return (ms - sub) / (to - sub) * 100; }
    var waitEnd = hasStart ? start : nowMs;
    return {
      queuedWidth: pct(waitEnd),
      runLeft: hasStart ? pct(start) : null,
      runWidth: hasStart ? pct(end) - pct(start) : null,
      capLeft: cap !== null ? pct(cap) : null,
      nowLeft: pct(nowMs),
      running: running,
      done: done,
      waitedSeconds: Math.round((waitEnd - sub) / 1000),
      ranSeconds: hasStart ? Math.round((end - start) / 1000) : 0,
      leftSeconds: cap !== null ? Math.round((cap - nowMs) / 1000) : null,
      submittedAt: sub,
      startedAt: hasStart ? start : null,
      endedAt: done ? fin : null,
      capAt: cap,
      axisFrom: sub,
      axisTo: to
    };
  }

  function jobLife(job, nowMs) {
    var g = lifeSegments(job, nowMs);
    if (!g) return null;
    var mine = job.submitter && job.submitter === identity;
    var box = el("div", "life");

    var top = el("div", "life-top");
    top.appendChild(el("span", null, "Life of this run"));
    var head = g.running && g.leftSeconds !== null
      ? ago(g.ranSeconds) + " of a " + ago(job.max_runtime_seconds) + " limit"
      : g.done ? "ran for " + ago(g.ranSeconds)
      : g.running ? ago(g.ranSeconds) + " · no limit set"
      : "waiting " + ago(g.waitedSeconds);
    top.appendChild(el("span", "t", head));
    box.appendChild(top);

    var track = el("div", "life-track");
    if (g.queuedWidth > 0) {
      var q = el("div", "life-seg queued", "queued " + ago(g.waitedSeconds));
      q.style.left = "0";
      q.style.width = g.queuedWidth + "%";
      track.appendChild(q);
    }
    if (g.runLeft !== null) {
      var r = el("div", "life-seg run" + (mine ? "" : " other"),
        (g.running ? "running " : "ran ") + ago(g.ranSeconds));
      r.style.left = g.runLeft + "%";
      r.style.width = g.runWidth + "%";
      track.appendChild(r);
    }
    if (g.capLeft !== null) {
      var left = el("div", "life-seg left", ago(g.leftSeconds) + " before the limit stops it");
      left.style.left = g.nowLeft + "%";
      left.style.width = (g.capLeft - g.nowLeft) + "%";
      track.appendChild(left);
      var cap = el("div", "life-cap");
      cap.style.left = g.capLeft + "%";
      track.appendChild(cap);
    }
    box.appendChild(track);

    // Ordered by what the reader needs most, then thinned so none overprints.
    var wanted = [{ at: 0, text: "submitted " + clockAt(g.submittedAt), cls: "" }];
    if (g.capAt !== null) {
      wanted.push({ at: lifePct(g, g.capAt), text: "limit " + clockAt(g.capAt), cls: "cap" });
    }
    if (g.running) wanted.push({ at: g.nowLeft, text: "now", cls: "now" });
    if (g.endedAt !== null) {
      wanted.push({ at: lifePct(g, g.endedAt), text: "ended " + clockAt(g.endedAt), cls: "" });
    }
    if (g.startedAt !== null) {
      wanted.push({ at: lifePct(g, g.startedAt), text: "started " + clockAt(g.startedAt), cls: "" });
    }
    var marks = el("div", "life-marks");
    thinMarks(wanted, 9).forEach(function (m) {
      var edge = m.at < 4 ? " at-start" : m.at > 96 ? " at-end" : "";
      var node = el("div", "life-mark" + (m.cls ? " " + m.cls : "") + edge, m.text);
      node.style.left = m.at + "%";
      marks.appendChild(node);
    });
    box.appendChild(marks);

    var say = el("div", "life-say");
    if (g.startedAt === null) {
      say.appendChild(txt("Waiting "));
      say.appendChild(el("b", null, ago(g.waitedSeconds)));
      say.appendChild(txt(" for a device. Nothing has run yet."));
    } else {
      say.appendChild(txt("Waited "));
      say.appendChild(el("b", null, ago(g.waitedSeconds)));
      say.appendChild(txt(" for a device, then "));
      say.appendChild(el("b", null, (g.running ? "has run " : "ran ") + ago(g.ranSeconds)));
      if (g.capAt !== null) {
        say.appendChild(txt(". The controller stops it at "));
        say.appendChild(el("b", null, clockAt(g.capAt)));
        say.appendChild(txt(" unless it finishes first."));
      } else {
        say.appendChild(txt("."));
      }
    }
    box.appendChild(say);
    return box;
  }

  // Marks that land on top of each other are worse than a missing mark: a run
  // submitted eight minutes before it started puts two labels in the same
  // place on a twelve-hour axis, and they overprint into nonsense. Keep them
  // in order of what the reader needs, and drop any that cannot clear the one
  // before it. Nothing is lost — the sentence under the strip states every
  // one of these times in words.
  function thinMarks(marks, minGap) {
    var kept = [];
    for (var i = 0; i < marks.length; i++) {
      var clash = false;
      for (var k = 0; k < kept.length; k++) {
        if (Math.abs(kept[k].at - marks[i].at) < minGap) { clash = true; break; }
      }
      if (!clash) kept.push(marks[i]);
    }
    return kept.sort(function (a, b) { return a.at - b.at; });
  }

  // The marks share the segments' axis rather than recomputing one, so the
  // two cannot drift apart.
  function lifePct(g, ms) {
    return (ms - g.axisFrom) / (g.axisTo - g.axisFrom) * 100;
  }

  function paintJob(box, id, job, queuePosition) {
    box.textContent = "";
    var root = box;
    var tabs = buildJobWorkspaceTabs(id, root);
    root.appendChild(tabs);

    // The life of this run sits above both columns, because it is the one
    // thing here that is true of the whole job rather than of its facts or
    // its output.
    workspaceLife.textContent = "";
    var life = jobLife(job, controllerNow());
    if (life) workspaceLife.appendChild(life);

    var stateClass = job.state === "failed" || job.state === "lost" ? "failed"
      : job.state === "succeeded" ? "done" : "busy";
    box.appendChild(el("p", "big " + stateClass, jobStateWord(job.state)));

    var under = el("p", "under");
    under.appendChild(txt((job.submitter || "someone") + " · "));
    if (job.device_id) {
      under.appendChild(button("linkish", job.device_id, function () { openDevice(job.device_id); }));
    } else {
      under.appendChild(txt(job.selector ? "any device matching " + job.selector : "no device yet"));
    }
    box.appendChild(under);

    // How long, from the numbers the controller measured. A queued job's
    // wait and a running job's elapsed both come off /v1/state rather than
    // being computed here.
    var waits = (latest && latest.queued_waiting_seconds) || {};
    var view = job.device_id ? deviceIndex[job.device_id] : null;
    if (job.state === "queued" && typeof waits[id] === "number") {
      var wait = el("div", "note" + (waits[id] >= 600 ? " caution" : ""));
      wait.appendChild(el("h3", null, "Waiting " + ago(waits[id]) + " for a device."));
      var why = job.device_id
        ? "It asked for " + job.device_id + " by name, so it waits for that one device."
        : "It will start on the first matching device that comes free.";
      // queue_position is 1-based, so position 1 means nothing is ahead of
      // it (see store.QueuePosition). Saying "1 job ahead" for that would be
      // off by one in the direction that makes a queue look worse than it is.
      if (queuePosition === 1) why += " It is next in line.";
      else if (queuePosition > 1) why += " There " + (queuePosition === 2 ? "is 1 job" : "are " + (queuePosition - 1) + " jobs") +
        " ahead of it.";
      if (waits[id] >= 600) why += " That is a long wait — check whether whatever holds the device is stuck.";
      wait.appendChild(el("p", null, why));
      box.appendChild(wait);
    } else if (view && view.job_id === id && view.elapsed_seconds) {
      box.appendChild(el("p", "under", "Running for " + ago(view.elapsed_seconds) + "."));
    }

    if (job.kill_reason) {
      var stopped = el("div", "note caution");
      stopped.appendChild(el("h3", null, "Why it stopped"));
      stopped.appendChild(el("p", null, job.kill_reason));
      box.appendChild(stopped);
    }

    var facts = el("dl", "facts");
    function fact(k, val) {
      if (val === undefined || val === null || val === "") return;
      facts.appendChild(el("dt", null, k));
      facts.appendChild(el("dd", null, String(val)));
    }
    fact("job id", id);
    fact("submitted", clockTime(job.submitted_at));
    fact("started", job.started_at ? clockTime(job.started_at) : "");
    fact("finished", job.finished_at ? clockTime(job.finished_at) : "");
    if (typeof job.exit_code === "number") fact("exit code", job.exit_code);
    if (job.priority) fact("priority", job.priority);
    if (job.max_runtime_seconds) fact("time limit", ago(job.max_runtime_seconds));
    if (job.cwd) fact("working directory", job.cwd);
    if (job.kind === "hold") fact("kind", "a hold — the device is claimed, nothing is being run for it");
    if (job.stdio === "tty") fact("output", "attached to a terminal (rc attach)");
    if (job.stdio === "pipe") fact("output", "attached to a pipe (rc cp)");
    var block = el("div", "block");
    block.appendChild(el("h3", "sec", "Details"));
    block.appendChild(facts);
    box.appendChild(block);

    // The full command, on demand and out of the way — the thing that used
    // to be the widest element on the page. Shown in a bounded, wrapped,
    // scrollable box with its size stated, so a 6 kB base64 argument is a
    // scrollbar rather than a broken layout.
    if (job.kind !== "hold" && job.command && job.command.length) {
      var full = (job.command || []).join(" ");
      var cmdBlock = el("div", "block");
      var head = el("div", "full-head");
      head.appendChild(el("h3", "sec", "Command" + (full.length > 400 ? " · " + bytes(full.length) : "")));
      head.appendChild(button("tiny", "copy", function () { copyText(full); }));
      cmdBlock.appendChild(head);
      cmdBlock.appendChild(el("pre", "full mono", full));
      box.appendChild(cmdBlock);
    }

    if (identity && !terminalState(job.state)) {
      var actions = el("div", "block");
      var kill = button("act" + (job.submitter === identity ? "" : " foreign"),
        job.kind === "hold" ? "Release this hold" : "Kill this job",
        function () { killJob({ id: id, device_id: job.device_id, submitter: job.submitter }); });
      actions.appendChild(kill);
      box.appendChild(actions);
    }

    // The output pane is built once per job and then carried across every
    // re-render of this panel: rebuilding it would restart the stream from
    // the top of the file every five seconds, which is both a waste of the
    // controller's file handles and unreadable. It IS rebuilt when a job
    // that had nothing to show starts running.
    // Built once per job and then left exactly where it is. Re-creating it
    // would restart the stream from the top of the stored file on every
    // refresh; re-appending it would reset the reader's scroll. It IS rebuilt
    // when a job that had nothing to show starts running.
    if (logBlock === null || logBlockJob !== id || (logBlockQueued && job.state !== "queued")) {
      logJobID = id;
      logBlock = logSection(id, job);
      logBlockJob = id;
      logBlockQueued = job.state === "queued";
      workspaceOutput.textContent = "";
      workspaceOutput.appendChild(logBlock);
    } else if (logBlock.parentNode !== workspaceOutput) {
      workspaceOutput.textContent = "";
      workspaceOutput.appendChild(logBlock);
    }
    workspaceOutput.classList.remove("hide");
  }

  function terminalState(s) {
    return s === "succeeded" || s === "failed" || s === "killed" || s === "lost";
  }

  function copyText(s) {
    if (!navigator.clipboard) { actFail("this browser will not let the page copy — select it instead"); return; }
    navigator.clipboard.writeText(s).then(function () { actOK("copied"); },
      function () { actFail("could not copy — select it instead"); });
  }

  // ---- the live log -----------------------------------------------------
  //
  // /v1/jobs/{id}/logs is not SSE: it is a plain streaming response that
  // ends when the job does. It is read chunk by chunk off a ReadableStream
  // and appended as text nodes, so output appears as it is produced rather
  // than when the job ends.

  var logAbort = null, logPane = null, logChars = 0;
  var logStateNode = null, logStateText = null, logJump = null, logFollowBtn = null;
  var logState = "waiting";   // waiting | live | ended | broken | reconnecting
  var logDetail = "";
  var logFollow = true;       // is the reader at the live edge?
  var logUnseen = 0;          // lines appended while they were not
  var logBuffer = "", logFrame = 0, logTruncated = false;
  var logJobID = null;
  var logBlock = null, logBlockJob = null, logBlockQueued = false;
  var LOG_CAP = 400000;   // characters kept in the DOM; older output is dropped

  function stopLogStream() {
    if (logAbort) { logAbort.abort(); logAbort = null; }
    if (logFrame) { cancelAnimationFrame(logFrame); logFrame = 0; }
    logPane = null;
    logStateNode = null;
    logStateText = null;
    logJump = null;
    logFollowBtn = null;
    logChars = 0;
    logBuffer = "";
    logUnseen = 0;
    logState = "waiting";
    logDetail = "";
    logFollow = true;
    logTruncated = false;
  }

  // Called whenever the panel moves to a different subject: the stream is
  // dropped and the pane with it, so nothing keeps a connection open to a
  // job nobody is looking at any more.
  function dropLogBlock() {
    stopLogStream();
    logBlock = null;
    logBlockJob = null;
    logBlockQueued = false;
  }

  function logSection(id, job) {
    var block = el("div", "block");
    block.appendChild(el("h3", "sec", "Output"));

    if (job.stdio === "tty" || job.stdio === "pipe") {
      block.appendChild(el("p", "under",
        "This job's output goes straight to whoever attached to it, not to the controller. " +
        "Use rc attach from a terminal."));
      return block;
    }
    if (job.state === "queued") {
      block.appendChild(el("p", "under", "Nothing has run yet."));
      return block;
    }
    if (job.kind === "hold") {
      block.appendChild(el("p", "under", "A hold runs nothing, so it produces no output."));
      return block;
    }

    var bar = el("div", "log-bar");
    var state = el("div", "log-state");
    state.appendChild(el("i"));
    var stateText = el("span", null, "waiting for the controller…");
    state.appendChild(stateText);
    bar.appendChild(state);
    var tools = el("div", "log-tools");
    var followBtn = button("tiny", "Pause following", function () { logSetFollow(!logFollow); });
    tools.appendChild(followBtn);
    bar.appendChild(tools);

    var wrap = el("div", "log-wrap");
    var pre = el("pre", "log mono");
    var jump = button("log-jump", "Jump to live", function () { logSetFollow(true); });
    jump.classList.add("hide");
    wrap.appendChild(pre);
    wrap.appendChild(jump);

    block.appendChild(bar);
    block.appendChild(wrap);

    // Only one stream at a time, and it is dropped the moment the workspace
    // moves on: an abandoned reader keeps a connection, a goroutine and a
    // file handle alive on the controller.
    stopLogStream();
    logPane = pre;
    logStateNode = state;
    logStateText = stateText;
    logJump = jump;
    logFollowBtn = followBtn;
    logChars = 0;
    logUnseen = 0;
    logFollow = true;
    logTruncated = false;

    // The reader's own scrolling is what decides whether they are following.
    // Reaching the bottom by hand resumes it; leaving it pauses without
    // touching the network, so nothing is missed while they read.
    pre.addEventListener("scroll", function () {
      if (logPane !== pre) return;
      var atEdge = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 30;
      if (atEdge && !logFollow) logSetFollow(true);
      else if (!atEdge && logFollow) { logFollow = false; logUnseen = 0; logPaint(); }
    });

    logStart(id);
    return block;
  }

  function logStart(id) {
    var ctrl = new AbortController();
    logAbort = ctrl;
    logPaint();
    fetch("/v1/jobs/" + encodeURIComponent(id) + "/logs",
          { headers: authHeaders(), signal: ctrl.signal })
      .then(function (r) {
        if (ctrl !== logAbort) return;
        if (!r.ok) return serverError(r).then(function (m) { logSetState("broken", "no output: " + m); });
        if (!r.body) { logSetState("broken", "this browser cannot stream the log"); return; }
        logSetState("live", "");
        var reader = r.body.getReader();
        var decoder = new TextDecoder();
        function pump() {
          return reader.read().then(function (res) {
            if (ctrl !== logAbort) { reader.cancel(); return; }
            if (res.done) {
              logAppend(decoder.decode());
              logFlush();
              // End of body is ambiguous and cannot be made otherwise from
              // here: a job that finished and a connection that died both
              // simply stop arriving, and a plain streaming response has no
              // terminator that distinguishes them. What settles it is the
              // controller's own view of the job — if it is still running,
              // then the output has not ended, the stream has.
              var current = jobIndex[logJobID];
              if (current && !terminalState(current.state)) {
                logSetState("broken", "the job is still running");
                logOfferReconnect(logJobID);
              } else {
                logSetState("ended", "");
              }
              return;
            }
            logAppend(decoder.decode(res.value, { stream: true }));
            return pump();
          });
        }
        return pump();
      })
      .catch(function (e) {
        if (e && e.name === "AbortError") return;
        if (ctrl !== logAbort) return;
        // NOT "output ended". A stream that died mid-job and a job that
        // finished are the same number of bytes and completely different
        // facts, and reading the first as the second is how someone
        // concludes a run stopped when it is still going.
        logSetState("broken", e.message);
        logOfferReconnect(logJobID);
      });
  }

  function logSetState(next, detail) {
    logState = next;
    logDetail = detail || "";
    logPaint();
  }

  function logSetFollow(on) {
    logFollow = !!on;
    if (logFollow) {
      logUnseen = 0;
      if (logPane) logPane.scrollTop = logPane.scrollHeight;
    }
    logPaint();
  }

  // Every state this viewer can be in, said in words. The dot repeats it in
  // colour for a glance, and never carries it alone.
  function logStateWords() {
    if (logState === "waiting") return { tone: "", text: "waiting for the controller…" };
    if (logState === "broken") {
      return { tone: "broken", text: "the stream stopped" + (logDetail ? " — " + logDetail : "") };
    }
    if (logState === "ended") {
      return { tone: "", text: logChars ? "output ended" : "the job produced no output" };
    }
    if (logState === "reconnecting") return { tone: "", text: "reconnecting…" };
    if (!logFollow) {
      return { tone: "paused", text: "streaming · following paused" };
    }
    return { tone: "live", text: "streaming · following" };
  }

  function logPaint() {
    if (!logStateNode) return;
    var words = logStateWords();
    logStateNode.className = "log-state" + (words.tone ? " " + words.tone : "");
    logStateText.textContent = words.text;
    var streaming = logState === "live";
    if (logFollowBtn) {
      logFollowBtn.classList.toggle("hide", !streaming);
      logFollowBtn.textContent = logFollow ? "Pause following" : "Follow";
    }
    if (logJump) {
      logJump.classList.toggle("hide", logFollow || !streaming);
      logJump.textContent = logUnseen
        ? "Jump to live · " + logUnseen + (logUnseen === 1 ? " new line" : " new lines")
        : "Jump to live";
    }
  }

  // Chunks are decoded as they arrive but written to the document on the next
  // frame, so a writer printing thousands of lines a second costs one layout
  // per frame rather than one per chunk.
  function logAppend(chunk) {
    if (!chunk || !logPane) return;
    logBuffer += chunk;
    if (logFrame) return;
    logFrame = requestAnimationFrame(function () { logFrame = 0; logFlush(); });
  }

  function logFlush() {
    if (logFrame) { cancelAnimationFrame(logFrame); logFrame = 0; }
    var chunk = logBuffer;
    logBuffer = "";
    if (!chunk || !logPane) return;
    var pane = logPane;
    var lines = chunk.split("\n").length - 1;
    // Whether the reader is still at the live edge is decided HERE, before
    // anything is written, and not left to the scroll listener alone: a
    // scroll event is dispatched asynchronously, so between someone dragging
    // upward and that event being handled there is a window in which a flush
    // would see stale follow state and haul them back to the bottom. The
    // listener still runs, for immediate feedback; this is what makes it
    // correct.
    var atEdge = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 30;
    if (logFollow && !atEdge) { logFollow = false; logUnseen = 0; }
    pane.appendChild(txt(chunk));
    logChars += chunk.length;
    // Bounded: a job that prints for a day must not grow this tab without
    // limit. The oldest nodes go first, which is the right end to lose — and
    // the reader is told, because output silently disappearing from the top
    // of a pane looks like the job never printed it.
    while (logChars > LOG_CAP && pane.firstChild && pane.childNodes.length > 1) {
      logChars -= (pane.firstChild.textContent || "").length;
      pane.removeChild(pane.firstChild);
      if (!logTruncated) {
        logTruncated = true;
        pane.insertBefore(el("span", "log-note",
          "— earlier output is no longer shown here; the controller still has all of it —\n"),
          pane.firstChild);
      }
    }
    if (logFollow) pane.scrollTop = pane.scrollHeight;
    else if (lines) { logUnseen += lines; logPaint(); }
  }

  // The API cannot resume from an offset, so reconnecting replays the stored
  // output from the beginning. That is a different thing from continuing, and
  // it throws away where the reader was — so it is offered, never done.
  function logOfferReconnect(id) {
    if (!logStateNode || !id) return;
    var again = button("tiny", "Reconnect", function () {
      logStateNode.parentNode.removeChild(again);
      if (!logPane) return;
      logPane.textContent = "";
      logChars = 0;
      logUnseen = 0;
      logTruncated = false;
      logFollow = true;
      logSetState("reconnecting", "");
      logStart(id);
    });
    again.title = "Replays this job's stored output from the beginning — the controller cannot resume part-way.";
    logStateNode.parentNode.appendChild(again);
  }

  // ---- usage sheets -----------------------------------------------------
  //
  // A usage sheet is Markdown an operator wrote on the host, and it is the
  // most important prose on this page — it is how a machine explains itself.
  // It is also, from this page's point of view, untrusted input: it arrives
  // over the API and nothing this page can check wrote it.
  //
  // So this renderer builds DOM nodes and only DOM nodes. Every scrap of
  // text goes through textContent; there is no innerHTML, no template, no
  // string of markup anywhere in it. It supports a deliberately small
  // subset — headings, lists, quotes, rules, code, emphasis — and anything
  // it does not recognise, including any HTML in the source, is shown as
  // the plain text it is.
  //
  // Links are rendered as their text followed by the URL, NOT as anchors:
  // the href would be the one attacker-influenceable value on this page
  // that is not a text node, and "javascript:" is one typo in a scheme
  // check away. A URL that is readable and has to be copied is a small
  // price for closing that off entirely.

  function renderMarkdown(src) {
    var frag = document.createDocumentFragment();
    var lines = String(src == null ? "" : src).replace(/\r\n?/g, "\n").split("\n");
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      if (/^\s*```/.test(line)) {
        var fence = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { fence.push(lines[i]); i++; }
        i++; // the closing fence, if there was one
        frag.appendChild(el("pre", null, fence.join("\n")));
        continue;
      }
      if (/^\s*$/.test(line)) { i++; continue; }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { frag.appendChild(el("hr")); i++; continue; }

      var heading = /^\s*(#{1,6})\s+(.*)$/.exec(line);
      if (heading) {
        // h3/h4 rather than h1/h2: the panel already owns the top of the
        // document outline, and a sheet is a section within it.
        var h = el(heading[1].length <= 2 ? "h3" : "h4");
        inline(heading[2], h);
        frag.appendChild(h);
        i++;
        continue;
      }

      if (/^\s*>/.test(line)) {
        var quoted = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          quoted.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        var bq = el("blockquote");
        var p = el("p");
        inline(quoted.join(" "), p);
        bq.appendChild(p);
        frag.appendChild(bq);
        continue;
      }

      var bullet = /^\s*([-*+]|\d+[.)])\s+(.*)$/.exec(line);
      if (bullet) {
        var ordered = /\d/.test(bullet[1]);
        var list = el(ordered ? "ol" : "ul");
        while (i < lines.length) {
          var item = /^\s*([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i]);
          if (!item || /\d/.test(item[1]) !== ordered) break;
          var li = el("li");
          inline(item[2], li);
          list.appendChild(li);
          i++;
        }
        frag.appendChild(list);
        continue;
      }

      var para = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) &&
             !/^\s*(#{1,6})\s+/.test(lines[i]) && !/^\s*```/.test(lines[i]) &&
             !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) && !/^\s*>/.test(lines[i])) {
        para.push(lines[i]);
        i++;
      }
      var pn = el("p");
      inline(para.join(" "), pn);
      frag.appendChild(pn);
    }
    return frag;
  }

  var INLINE = /`([^`]+)`|\*\*([^*]+)\*\*|__([^_]+)__|\*([^*]+)\*|_([^_]+)_|\[([^\]]*)\]\(([^)\s]*)\)/;

  function inline(text, into) {
    var rest = String(text);
    while (rest) {
      var m = INLINE.exec(rest);
      if (!m) { into.appendChild(txt(rest)); return; }
      if (m.index > 0) into.appendChild(txt(rest.slice(0, m.index)));
      if (m[1] !== undefined) into.appendChild(el("code", null, m[1]));
      else if (m[2] !== undefined) into.appendChild(el("strong", null, m[2]));
      else if (m[3] !== undefined) into.appendChild(el("strong", null, m[3]));
      else if (m[4] !== undefined) into.appendChild(el("em", null, m[4]));
      else if (m[5] !== undefined) into.appendChild(el("em", null, m[5]));
      else {
        // A link, flattened to text on purpose — see the note above.
        into.appendChild(txt(m[6] || ""));
        if (m[7]) into.appendChild(txt((m[6] ? " " : "") + "(" + m[7] + ")"));
      }
      rest = rest.slice(m.index + m[0].length);
    }
  }

  // ---- liveness ---------------------------------------------------------

  function stopLive() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (freshTimer) { clearInterval(freshTimer); freshTimer = null; }
    if (es) { es.close(); es = null; }
  }

  function returnToGate() {
    stopLive();
    closeWorkspace();
    sessionStorage.removeItem("rc_token");
    actOK("");
    gate.classList.remove("hide");
    app.classList.add("hide");
  }

  function fetchState() {
    return fetch("/v1/state", { headers: authHeaders() })
      // A network failure rejects with the browser's own wording ("Failed to
      // fetch"), which reads as a bug in the page rather than as what it is.
      // Said plainly here; the freshness pill beside it says how long ago the
      // picture below was true.
      .catch(function () { throw new Error("cannot reach the controller"); })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) {
          returnToGate();
          throw new Error("token rejected");
        }
        if (!r.ok) throw new Error("state: " + r.status);
        anchorClock(r);
        return r.json();
      });
  }

  // A finished job never changes again, so the day is re-read on its own
  // slower cadence rather than with every five-second state poll.
  var HISTORY_LIMIT = 200;            // the server's own ceiling on this route
  var HISTORY_MIN_INTERVAL_MS = 15000;

  function fetchHistory(force) {
    if (!force && historyFetchedAt &&
        Date.now() - historyFetchedAt < HISTORY_MIN_INTERVAL_MS) {
      return Promise.resolve(history);
    }
    return fetch("/v1/jobs?limit=" + HISTORY_LIMIT, { headers: authHeaders() })
      .catch(function () { throw new Error("cannot reach the controller"); })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) {
          returnToGate();
          throw new Error("token rejected");
        }
        if (!r.ok) throw new Error("jobs: " + r.status);
        anchorClock(r);
        return r.json();
      })
      .then(function (body) {
        history = (body && body.jobs) || [];
        historyFetchedAt = Date.now();
        history.forEach(function (j) { jobIndex[j.id] = j; });
        // The day arrives on its own cadence, so it has to draw itself when
        // it lands. Without this the first paint after a reload shows only
        // the jobs running right now — the chart looks nearly empty until
        // the next state poll happens to redraw it.
        if (latest) drawFleet(latest.devices || [], latest);
        return history;
      });
  }

  // The delta between two readings of THIS browser's clock, so it is immune
  // to skew by construction — unlike every age on the wire, which the server
  // computes for exactly that reason. A controller that has gone unreachable
  // must not leave the page looking current.
  function updateFreshness() {
    var live = document.getElementById("live");
    var text = document.getElementById("liveText");
    if (!lastFetchAt) { text.textContent = "connecting…"; live.className = "live"; return; }
    var age = Math.floor((Date.now() - lastFetchAt) / 1000);
    text.textContent = age < 10 ? "live" : "updated " + ago(age) + " ago";
    live.className = "live" + (age > 30 ? " stale" : age > 10 ? " warn" : "");
    tickFeed();  // the feed's own ages tick with this
    if (latest && (age === 31 || (age > 31 && age % 30 === 0))) {
      renderAttention(latest.devices || [], latest);
    }
  }

  function refresh() {
    // The day is not fatal. A fleet that renders without its timeline is far
    // better than a blank page because one of two reads failed, so this is
    // deliberately not part of the chain below: the chart keeps the last day
    // it managed to read.
    fetchHistory().catch(function () {});
    return fetchState()
      .then(function (state) { lastFetchAt = Date.now(); updateFreshness(); render(state); })
      .catch(function (e) {
        fail(e.message);
        if (latest) renderAttention(latest.devices || [], latest);
      });
  }

  // A burst of events (a worker registering ten devices) must not become a
  // burst of /v1/state reads.
  function nudge() {
    if (nudgePending) return;
    nudgePending = true;
    setTimeout(function () { nudgePending = false; refresh(); }, 250);
  }

  function connectEvents() {
    if (es) return;
    try {
      es = new EventSource("/v1/events?token=" + encodeURIComponent(token));
      es.onmessage = function (m) {
        // A job event is the one thing on the wire that says what actually
        // happened, rather than that something did — so the feed reads it
        // directly, and the board catches up on the refresh it triggers.
        try {
          var ev = JSON.parse(m.data);
          if (ev && ev.kind === "jobs") noteJobEvent(ev.payload);
        } catch (e) { /* a frame we cannot read still means "refetch" */ }
        nudge();
      };
      es.onerror = function () { if (!err.textContent) fail("event stream dropped; polling"); };
    } catch (e) { /* polling remains the fallback */ }
  }

  // Ask the controller what this token can do, so the page offers the actions
  // it actually has rather than finding out from a 403.
  function loadRole() {
    return fetch("/v1/whoami", { headers: authHeaders() })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { role = (d && d.role) || ""; renderRole(); })
      .catch(function () { role = ""; renderRole(); });
  }

  function renderRole() {
    var badge = document.getElementById("role");
    badge.textContent = role === "admin" ? "admin" : "";
    badge.className = role === "admin" ? "badge" : "hide";
  }

  function renderWho() {
    document.getElementById("whoHint").textContent =
      identity ? "— kill controls act as " + identity : "— set this to enable kill controls";
  }

  function start() {
    stopLive();
    gate.classList.add("hide");
    app.classList.remove("hide");
    document.getElementById("who").value = identity;
    renderWho();
    lastFetchAt = null;
    prevDevices = null;
    feed = [];
    renderFeed();
    updateFreshness();
    loadRole();
    refresh();
    pollTimer = setInterval(refresh, 5000);
    freshTimer = setInterval(updateFreshness, 1000);
  }

  // ---- wiring -----------------------------------------------------------

  document.getElementById("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    token = document.getElementById("token").value.trim();
    sessionStorage.setItem("rc_token", token);
    start();
  });

  document.getElementById("whoBar").addEventListener("submit", function (e) {
    e.preventDefault();
    identity = document.getElementById("who").value.trim();
    renderWho();
    refresh();
  });

  document.getElementById("workspaceBack").addEventListener("click", closeWorkspace);
  document.addEventListener("keydown", handleWorkspaceKeydown);
  window.addEventListener("hashchange", routeFromHash);
  routeFromHash();

  if (token) start();
})();
</script>
</body>
</html>
