  var FEED_MAX = 120;

  function record(entry) {
    entry.at = entry.at || Date.now();
    feed.push(entry);
    feed.sort(function (a, b) { return b.at - a.at; });
    if (feed.length > FEED_MAX) feed.length = FEED_MAX;
    renderFeed();
  }

  function renderFeed() {
    var box = document.getElementById("feed");
    box.textContent = "";
    if (!feed.length) {
      box.appendChild(el("div", "empty", "Nothing has happened yet."));
      return;
    }
    feed.forEach(function (e) {
      var row = el("div", "ev" + (e.tone ? " " + e.tone : ""));
      var inner;
      if (e.open) {
        inner = el("button", "ev-open");
        inner.type = "button";
        inner.addEventListener("click", e.open);
      } else {
        inner = el("div", "ev-static");
      }
      var when = el("span", "ev-time", sinceLocal(e.at));
      when.title = new Date(e.at).toLocaleTimeString();
      e.timeEl = when;   // ticked in place once a second, rather than
                         // rebuilding this list under the reader's cursor
      inner.appendChild(when);
      var body = el("span", "ev-text");
      e.parts.forEach(function (p) {
        if (typeof p === "string") body.appendChild(txt(p));
        else body.appendChild(el("b", null, p.b));
      });
      inner.appendChild(body);
      row.appendChild(inner);
      box.appendChild(row);
    });
  }

  function tickFeed() {
    feed.forEach(function (e) {
      if (e.timeEl) e.timeEl.textContent = sinceLocal(e.at);
    });
  }

  function sinceLocal(at) {
    var s = Math.floor((Date.now() - at) / 1000);
    if (s < 5) return "now";
    return ago(s);
  }

  // A job event arrives as {job_id, state} and nothing else, so the words
  // come from whatever this page already knows about the job. If it knows
  // nothing — an event for a job submitted from a terminal before this tab
  // ever saw it — the job is fetched once and the sentence is filled in.
  function noteJobEvent(payload) {
    if (!payload || !payload.job_id) return;
    var id = payload.job_id, state = payload.state;
    var entry = {
      parts: jobEventWords(jobIndex[id], id, state),
      tone: (state === "failed" || state === "lost") ? "bad" : "",
      open: function () { openJob(id); }
    };
    record(entry);
    if (!jobIndex[id]) {
      fetch("/v1/jobs/" + encodeURIComponent(id), { headers: authHeaders() })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (v) {
          if (!v || !v.job) return;
          jobIndex[id] = v.job;
          entry.parts = jobEventWords(v.job, id, state);
          renderFeed();
        })
        .catch(function () { /* the short-ID sentence stands */ });
    }
  }

  function jobEventWords(job, id, state) {
    var who = job && job.submitter;
    var where = (job && job.device_id) || "";
    var target = where ? " on " + where
      : (job && job.selector ? " on a device matching " + job.selector : "");
    // Two subjects, because a person queues work but a job finishes: "alice
    // was stopped" is not what happened. When the submitter is unknown, the
    // job's own short ID is the subject either way.
    var actor = [{ b: who || ("job " + id.slice(0, 8)) }];
    var owned = who ? [{ b: who }, "'s job"] : [{ b: "job " + id.slice(0, 8) }];
    switch (state) {
      case "queued": return actor.concat([" queued work" + target]);
      case "assigned": return owned.concat([" was given a device" + (where ? " — " + where : "")]);
      case "running": return actor.concat([" started running" + target]);
      case "succeeded": return owned.concat([" finished" + target]);
      case "failed": return owned.concat([" failed" + target]);
      case "killed": return owned.concat([" was stopped" + target]);
      case "lost": return owned.concat([" was lost" + target]);
    }
    return owned.concat([" — " + jobStateWord(state) + target]);
  }

  // Device transitions are derived by diffing successive snapshots rather
  // than read off an event: the `devices` event carries a whole snapshot
  // too, so there is nothing extra on the wire to use, and diffing also
  // covers the polling fallback when the stream is down.
  //
  // Deliberately quiet about ready↔busy caused by ordinary work: a job
  // event already said "alice started running on gpubox:gpu0", and saying
  // it twice is how a feed becomes noise. A hold has no such event worth
  // reading, so it is announced here.
  function noteDeviceChanges(views) {
    var now = {};
    views.forEach(function (v) {
      now[v.device.id] = { state: v.device.state, holder: v.holder || "", kind: v.kind || "" };
    });
    if (prevDevices === null) { prevDevices = now; return; }

    Object.keys(now).forEach(function (id) {
      var was = prevDevices[id], is = now[id];
      var opener = function () { openDevice(id); };
      if (!was) {
        record({ parts: [{ b: id }, " joined the fleet"], open: opener });
        return;
      }
      if (was.state !== is.state) {
        if (is.state === "unhealthy") {
          var view = deviceIndex[id];
          record({
            parts: [{ b: id }, " left the pool — " +
              explain(view && view.quarantine_reason).headline.toLowerCase().replace(/\.$/, "")],
            tone: "bad", open: opener
          });
        } else if (was.state === "unhealthy") {
          record({ parts: [{ b: id }, " is back in the pool"], open: opener });
        } else if (is.state === "unknown") {
          record({ parts: [{ b: id }, " stopped reporting"], tone: "bad", open: opener });
        } else if (was.state === "unknown") {
          record({ parts: [{ b: id }, " is reporting again"], open: opener });
        }
      }
      if (is.kind === "hold" && was.kind !== "hold" && is.holder) {
        record({ parts: [{ b: is.holder }, " took a hold on " + id], open: opener });
      }
      if (was.kind === "hold" && is.kind !== "hold" && was.holder) {
        record({ parts: [{ b: was.holder }, " released " + id], open: opener });
      }
    });
    Object.keys(prevDevices).forEach(function (id) {
      if (!now[id]) record({ parts: [{ b: id }, " was retired"] });
    });
    prevDevices = now;
  }

  // The first snapshot is not a set of changes, but it does carry real,
  // server-measured ages — so the feed opens with a true timeline of what
  // is already happening rather than an empty box. Every seeded entry is
  // backdated by the age the controller reported for it.
  function seedFeed(state) {
    (state.devices || []).forEach(function (v) {
      if (!v.holder) return;
      var id = v.device.id;
      var at = Date.now() - (v.elapsed_seconds || 0) * 1000;
      var words = v.kind === "hold"
        ? [{ b: v.holder }, " took a hold on " + id + (v.reason ? " — " + clip(v.reason, 60) : "")]
        : [{ b: v.holder }, " started running on " + id];
      record({ parts: words, at: at, open: function () { openDevice(id); } });
    });
    (state.queued || []).forEach(function (j) {
      var waited = (state.queued_waiting_seconds || {})[j.id] || 0;
      record({
        parts: jobEventWords(j, j.id, "queued"),
        at: Date.now() - waited * 1000,
        open: function () { openJob(j.id); }
      });
    });
    // Nothing records WHEN a device was quarantined, so the ones already out
    // of the pool cannot be placed on this timeline honestly. They get one
    // line saying so — the board above is where they are actually shown, in
    // full and in red.
    var out = (state.devices || []).filter(function (v) { return v.device.state === "unhealthy"; });
    if (out.length) {
      record({
        parts: [out.length === 1 ? "1 device was" : out.length + " devices were",
                " already out of the pool when this page opened"],
        tone: "bad"
      });
    }
  }

  // ---- the board --------------------------------------------------------

  function render(state) {
    err.textContent = "";
    connectEvents();
    latest = state;

    var views = state.devices || [];
    deviceIndex = {};
    views.forEach(function (v) { deviceIndex[v.device.id] = v; });
    (state.jobs || []).concat(state.queued || []).forEach(function (j) { jobIndex[j.id] = j; });

    // The first snapshot is a baseline, not a set of changes: it seeds the
    // feed with what is already happening instead of announcing the whole
    // fleet as if it had just arrived.
    var first = prevDevices === null;
    noteDeviceChanges(views);
    if (first) seedFeed(state);

    renderOverview(state);
    if (workspaceView.kind !== "fleet") renderWorkspace({ preserve: true });
    renderPlaces();
  }

  var fleetMode = "day";

  function setFleetMode(mode) {
    fleetMode = mode === "matrix" ? "matrix" : mode === "bays" ? "bays" : "day";
    document.querySelectorAll("#fleetMode button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === fleetMode));
    });
    document.getElementById("dayWindow").classList.toggle("hide", fleetMode !== "day");
    if (latest) drawFleet(latest.devices || [], latest);
  }

  function setDayWindow(hours) {
    dayWindowHours = hours;
    document.querySelectorAll("#dayWindow button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(Number(b.getAttribute("data-hours")) === hours));
    });
    if (latest) drawFleet(latest.devices || [], latest);
  }

  // Which of the two destinations is current, and how much is running.
  function renderPlaces() {
    var here = workspaceView.kind === "running" ? "running" : "fleet";
    document.querySelectorAll("#places button").forEach(function (b) {
      if (b.getAttribute("data-place") === here) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    var n = document.getElementById("placesRunning");
    var active = ((latest && latest.jobs) || []).filter(function (j) { return !j.finished_at; }).length;
    n.textContent = active ? String(active) : "";
  }

  document.querySelectorAll("#places button").forEach(function (b) {
    b.addEventListener("click", function () {
      navigateTo({ kind: b.getAttribute("data-place") });
    });
  });

  // The one place that decides which picture of the fleet is on screen.
  function drawFleet(views, state) {
    if (fleetMode === "day") renderDay(views, state);
    else renderMachineRoom(views, state);
  }

  document.querySelectorAll("#dayWindow button").forEach(function (b) {
    b.addEventListener("click", function () { setDayWindow(Number(b.getAttribute("data-hours"))); });
  });

  document.querySelectorAll("#fleetMode button").forEach(function (b) {
    b.addEventListener("click", function () { setFleetMode(b.getAttribute("data-mode")); });
  });

  function fleetFreshness(views) {
    var missing = 0, future = 0, oldest = null;
    views.forEach(function (v) {
      var age = v.oldest_label_age_seconds;
      if (typeof age !== "number" || !isFinite(age)) missing++;
      else if (age < 0) future++;
      else if (oldest === null || age > oldest) oldest = age;
    });
    return { missing: missing, future: future, oldest: oldest };
  }

  function renderOverview(state) {
    var views = state.devices || [];
    var free = 0, busy = 0, down = 0, quiet = 0;
    views.forEach(function (v) {
      if (v.device.state === "unhealthy") down++;
      else if (v.device.state === "busy") busy++;
      else if (v.device.state === "ready") free++;
      else quiet++;
    });
    var sum = document.getElementById("fleetSummary");
    sum.textContent = "";
    if (!views.length) {
      sum.textContent = "The fleet is waiting for its first device.";
    } else {
      sum.appendChild(el("b", null, String(free)));
      sum.appendChild(txt(free === 1 ? " device is free; " : " devices are free; "));
      sum.appendChild(el("b", null, String(busy)));
      sum.appendChild(txt(busy === 1 ? " is occupied" : " are occupied"));
      if (quiet) sum.appendChild(txt("; " + quiet + (quiet === 1 ? " is not reporting" : " are not reporting")));
      if (down) {
        sum.appendChild(txt("; "));
        sum.appendChild(el("span", "bad", down + (down === 1 ? " needs intervention" : " need intervention")));
      }
      sum.appendChild(txt("."));
    }

    var facts = document.getElementById("fleetFacts");
    facts.textContent = "";
    var queued = state.queued || [];
    var waits = state.queued_waiting_seconds || {};
    var longest = null;
    queued.forEach(function (j) {
      var waited = waits[j.id];
      if (typeof waited === "number" && (longest === null || waited > longest)) longest = waited;
    });
    var queueFact = el("span", "fleet-fact" + (longest !== null && longest >= 600 ? " warn" : ""));
    queueFact.appendChild(el("b", null, String(queued.length)));
    queueFact.appendChild(txt(queued.length === 1 ? " job queued" : " jobs queued"));
    if (longest !== null) queueFact.appendChild(txt(" · longest " + ago(longest)));
    facts.appendChild(queueFact);

    var fresh = fleetFreshness(views);
    if (fresh.missing) {
      var unknown = el("span", "fleet-fact warn");
      unknown.appendChild(el("b", null, "Freshness unknown"));
      unknown.appendChild(txt(" · " + fresh.missing + (fresh.missing === 1 ? " device" : " devices") +
        " did not report label age"));
      facts.appendChild(unknown);
    } else if (fresh.oldest !== null) {
      var oldest = el("span", "fleet-fact" + (fresh.oldest > 3600 ? " warn" : ""));
      oldest.appendChild(el("b", null, "Oldest labels"));
      oldest.appendChild(txt(" · " + ago(fresh.oldest)));
      facts.appendChild(oldest);
    }
    if (fresh.future) {
      var future = el("span", "fleet-fact warn");
      future.appendChild(el("b", null, "Future clock warning"));
      future.appendChild(txt(" · " + fresh.future + (fresh.future === 1 ? " device reports" : " devices report") +
        " label time ahead of the controller"));
      facts.appendChild(future);
    }

    drawFleet(views, state);
    renderPlaces();
    renderAttention(views, state);
    renderWorkStrip(state, views);
  }

  function deviceSeverity(state) {
    if (state === "unhealthy") return 4;
    if (state === "unknown") return 3;
    if (state === "busy") return 2;
    if (state === "ready") return 1;
    return 0;
  }

  function hostSeverity(views) {
    var severity = 0;
    views.forEach(function (v) { severity = Math.max(severity, deviceSeverity(v.device.state)); });
    return severity;
  }

  // ---- the day ----------------------------------------------------------

  var dayWindowHours = 8;

  // The window ends on the next hour boundary, so there is always between one
  // and sixty minutes of future on the right for queued work to sit in, and
  // the ticks land on round hours rather than wherever the page was opened.
  function dayWindow(nowMs, hours) {
    var HOUR = 3600000;
    var to = (Math.floor(nowMs / HOUR) + 1) * HOUR;
    return { from: to - hours * HOUR, to: to };
  }

  function dayPct(ms, win) {
    return (ms - win.from) / (win.to - win.from) * 100;
  }

  // The bars. /v1/jobs is read on its own slower cadence, so a job that
  // started in the last few seconds is in the state response and not yet in
  // the day; the union keeps the newest copy of each.
  function dayJobs(state) {
    var byID = {}, out = [];
    history.forEach(function (j) { byID[j.id] = j; });
    (state.jobs || []).forEach(function (j) { byID[j.id] = j; });
    Object.keys(byID).forEach(function (id) { out.push(byID[id]); });
    return out;
  }

  // When the CURRENT state began. Two of these are known and one is not.
  //
  // A device that stopped reporting has last_heartbeat_at, so its silence is
  // drawn exactly. A device that is out of the pool has no such field: the
  // controller records WHY it was quarantined, not when. The last job to run
  // on it bounds that from below, so the span is drawn from there and said to
  // be an inference. Inventing a precise start would be worse than "at least".
  function stateSpan(view, jobs, nowMs) {
    var d = view.device || {};
    if (d.state === "unknown") {
      var beat = instant(d.last_heartbeat_at);
      if (!isFinite(beat)) return null;
      return { kind: "unknown", from: beat, to: nowMs, inferred: false };
    }
    if (d.state !== "unhealthy") return null;
    var last = null;
    for (var i = 0; i < jobs.length; i++) {
      if (jobs[i].device_id !== d.id) continue;
      var end = instant(jobs[i].finished_at);
      if (!isFinite(end)) continue;
      if (last === null || end > last) last = end;
    }
    return { kind: "unhealthy", from: last, to: nowMs, inferred: true };
  }

  function clockAt(ms) {
    var d = new Date(ms);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function renderDay(views, state) {
    var room = document.getElementById("machineRoom");
    room.textContent = "";
    room.className = "machine-room day";
    if (!views.length) return;
    room.appendChild(dayChart(views, state, { hostRows: true }));
    room.appendChild(dayLegend());
  }

  // The chart itself, so a host or a single card can be drawn by the same
  // renderer the fleet uses rather than by a second one that drifts from it.
  function dayChart(views, state, opts) {
    opts = opts || {};
    var nowMs = controllerNow();
    var win = dayWindow(nowMs, dayWindowHours);
    var jobs = dayJobs(state);
    var waiting = state.queued_waiting_seconds || {};

    var scroll = el("div", "day-scroll");
    var grid = el("div", "day-grid");
    grid.style.setProperty("--day-col", (100 / dayWindowHours) + "%");

    var axis = el("div", "day-axis");
    axis.appendChild(el("div"));
    var ticks = el("div", "day-ticks");
    var HOUR = 3600000;
    var step = dayWindowHours > 12 ? 2 : 1;
    // An hour mark that lands under the now label is two labels in one place,
    // and now is the more useful of the two.
    var crowd = (win.to - win.from) / 18;
    for (var t = win.from; t <= win.to; t += HOUR * step) {
      if (Math.abs(t - nowMs) < crowd) continue;
      var tick = el("div", "day-tick", clockAt(t));
      tick.style.left = dayPct(t, win) + "%";
      ticks.appendChild(tick);
    }
    var nowTick = el("div", "day-tick now", "now");
    nowTick.style.left = dayPct(nowMs, win) + "%";
    ticks.appendChild(nowTick);
    axis.appendChild(ticks);
    grid.appendChild(axis);

    if (opts.hostRows) {
      var byHost = {};
      views.forEach(function (v) { (byHost[v.device.host || "—"] = byHost[v.device.host || "—"] || []).push(v); });
      Object.keys(byHost).sort(function (a, b) {
        return hostSeverity(byHost[b]) - hostSeverity(byHost[a]) || a.localeCompare(b);
      }).forEach(function (host) {
        grid.appendChild(dayHostRow(host, byHost[host]));
        byHost[host].sort(function (a, b) { return a.device.id.localeCompare(b.device.id); })
          .forEach(function (v) { grid.appendChild(dayLane(v, jobs, state, waiting, win, nowMs)); });
      });
    } else {
      views.slice().sort(function (a, b) { return a.device.id.localeCompare(b.device.id); })
        .forEach(function (v) { grid.appendChild(dayLane(v, jobs, state, waiting, win, nowMs)); });
    }

    var nowLayer = el("div", "day-nowlayer");
    var nowLine = el("div", "day-nowline");
    nowLine.style.left = dayPct(nowMs, win) + "%";
    nowLayer.appendChild(nowLine);
    grid.appendChild(nowLayer);

    scroll.appendChild(grid);
    return scroll;
  }

  function dayHostRow(host, views) {
    var row = el("div", "day-hostrow");
    var open = el("button", null, host);
    open.type = "button";
    open.setAttribute("data-workspace-kind", "host");
    open.setAttribute("data-workspace-id", host);
    open.addEventListener("click", function () { openHost(host); });
    row.appendChild(open);
    var facts = hostSummary(views);
    if (facts) row.appendChild(el("span", "facts", facts));
    var beat = null;
    views.forEach(function (v) {
      if (typeof v.heartbeat_age_seconds === "number" &&
          (beat === null || v.heartbeat_age_seconds > beat)) beat = v.heartbeat_age_seconds;
    });
    if (beat !== null) {
      row.appendChild(el("span", "beat" + (beat > 30 ? " bad" : ""),
        beat > 30 ? "last heard " + ago(beat) + " ago" : "heard " + ago(beat) + " ago"));
    }
    return row;
  }

  function dayLaneHeight(queueCount) {
    return 38 + queueCount * 30;
  }

  function dayQueueTop(index) {
    return 35 + index * 30;
  }

  function dayQueueShowsLabel(remainingPercent) {
    return remainingPercent >= 12;
  }

  function dayLane(v, jobs, state, waiting, win, nowMs) {
    var d = v.device;
    var queued = (state.queued || []).filter(function (j) { return j.device_id === d.id; });
    var lane = el("div", "day-lane");
    lane.style.height = dayLaneHeight(queued.length) + "px";

    var name = el("div", "day-name");
    var open = el("button", null, d.name || d.id);
    open.type = "button";
    open.setAttribute("data-workspace-kind", "device");
    open.setAttribute("data-workspace-id", d.id);
    open.addEventListener("click", function () { openDevice(d.id); });
    open.appendChild(el("span", "st " + d.state, v.holder || stateWord(d.state)));
    name.appendChild(open);
    lane.appendChild(name);

    var track = el("div", "day-track");
    var future = el("div", "day-future");
    future.style.left = dayPct(nowMs, win) + "%";
    future.style.right = "0";
    track.appendChild(future);

    jobs.forEach(function (j) {
      if (j.device_id !== d.id) return;
      var span = barSpan(j, win.from, win.to, nowMs);
      if (!span) return;
      track.appendChild(dayBar(j, span, nowMs));
    });

    var st = stateSpan(v, jobs, nowMs);
    if (st) track.appendChild(daySpan(st, win, nowMs));

    queued.forEach(function (j, index) {
      track.appendChild(dayGhost(j, waiting[j.id], win, nowMs, index));
    });
    lane.appendChild(track);
    return lane;
  }

  function dayBar(j, span, nowMs) {
    var running = !j.finished_at;
    var failed = j.state === "failed" || j.state === "lost";
    var bar = el("button", "day-job" +
      (j.submitter === identity ? " mine" : "") + (failed ? " failed" : ""));
    bar.type = "button";
    bar.style.left = span.left + "%";
    bar.style.width = span.width + "%";
    if (span.width > 7) bar.appendChild(el("span", null, j.submitter || "—"));
    var started = instant(j.started_at);
    var ended = running ? nowMs : instant(j.finished_at);
    var when = clockAt(started) + " to " + (running ? "now" : clockAt(ended)) +
      " (" + ago(Math.round((ended - started) / 1000)) + ")";
    var label = j.id + " — " + (j.submitter || "unknown") + ", " + (running ? "running" : j.state) +
      ", " + when;
    bar.title = label;
    bar.setAttribute("aria-label", label);
    bar.setAttribute("data-workspace-kind", "job");
    bar.setAttribute("data-workspace-id", j.id);
    bar.addEventListener("click", function () { openJob(j.id); });
    return bar;
  }

  function daySpan(st, win, nowMs) {
    var span = el("div", "day-span " + st.kind);
    var from = st.from === null || st.from < win.from ? win.from : st.from;
    span.style.left = dayPct(from, win) + "%";
    span.style.width = Math.max(0.5, dayPct(nowMs, win) - dayPct(from, win)) + "%";
    var known = st.from !== null && st.from >= win.from;
    var words = st.inferred
      ? (known ? "since at least " + clockAt(st.from) : "since before this window")
      : (known ? "since " + clockAt(st.from) + " · " + ago(Math.round((nowMs - st.from) / 1000))
               : "since before this window");
    span.appendChild(el("span", "day-plate", words));
    span.title = stateWord(st.kind) + " — " + words +
      (st.inferred ? ". The controller records why a device was quarantined, not when; this is the end of the last job that ran on it." : "");
    return span;
  }

  function dayGhost(j, waited, win, nowMs, index) {
    var g = el("button", "day-ghost");
    g.type = "button";
    var left = dayPct(nowMs, win);
    var remaining = 100 - left;
    g.style.left = left + "%";
    g.style.top = dayQueueTop(index) + "px";
    if (dayQueueShowsLabel(remaining)) {
      g.style.right = "0";
      g.appendChild(el("span", null, j.id + " waiting " + ago(typeof waited === "number" ? waited : 0)));
    } else {
      g.style.width = "24px";
      g.style.transform = "translateX(-100%)";
    }
    var label = j.id + " is queued for this device by name and has waited " +
      ago(typeof waited === "number" ? waited : 0);
    g.title = label;
    g.setAttribute("aria-label", label);
    g.setAttribute("data-workspace-kind", "job");
    g.setAttribute("data-workspace-id", j.id);
    g.addEventListener("click", function () { openJob(j.id); });
    return g;
  }

  function dayLegend() {
    var leg = el("div", "day-legend");
    function swatch(text, style) {
      var s = el("span");
      var i = el("i");
      Object.keys(style).forEach(function (k) { i.style.setProperty(k, style[k]); });
      s.appendChild(i);
      s.appendChild(el("span", null, text));
      leg.appendChild(s);
    }
    swatch("your work", { background: "var(--job-mine)" });
    swatch("everyone else", { background: "var(--job-other)" });
    swatch("did not finish", {
      background: "var(--job-other)",
      "box-shadow": "inset -4px 0 0 var(--bad)"
    });
    swatch("out of the pool", {
      "background-image": "repeating-linear-gradient(45deg,var(--hatch-bad) 0 4px,transparent 4px 8px)",
      border: "1px solid var(--bad-line)"
    });
    swatch("queued", { border: "1.5px dashed var(--faint)" });
    var gaps = el("span", null, "gaps are free capacity");
    gaps.style.color = "var(--faint)";
    leg.appendChild(gaps);
    return leg;
  }

  function renderMachineRoom(views, state) {
    var waitingBy = {};
    (state.queued || []).forEach(function (j) {
      if (!j.device_id) return;
      var secs = (state.queued_waiting_seconds || {})[j.id];
      (waitingBy[j.device_id] = waitingBy[j.device_id] || []).push({
        submitter: j.submitter, waited: typeof secs === "number" ? secs : 0
      });
    });

    var room = document.getElementById("machineRoom");
    room.textContent = "";
    room.className = "machine-room" + (fleetMode === "matrix" ? " matrix" : "");
    if (!views.length) {
      var e = el("div", "empty", "No devices are registered.");
      e.appendChild(el("div", "hint", "Start a worker on a device host and it will appear here."));
      room.appendChild(e);
      return;
    }

    var byHost = {};
    views.forEach(function (v) {
      var h = v.device.host || "—";
      (byHost[h] = byHost[h] || []).push(v);
    });

    var hosts = Object.keys(byHost).sort(function (a, b) {
      return hostSeverity(byHost[b]) - hostSeverity(byHost[a]) || a.localeCompare(b);
    });
    if (fleetMode === "matrix") {
      var table = el("table", "matrix-table");
      var head = el("thead"), headRow = el("tr");
      ["Device", "Work", "State", "Actions"].forEach(function (s) { headRow.appendChild(el("th", null, s)); });
      head.appendChild(headRow);
      table.appendChild(head);
      var body = el("tbody");
      var all = views.slice();
      all.sort(function (a, b) {
        var ah = a.device.host || "—", bh = b.device.host || "—";
        return hostSeverity(byHost[bh]) - hostSeverity(byHost[ah]) ||
          ah.localeCompare(bh) || a.device.id.localeCompare(b.device.id);
      });
      all.forEach(function (v) { body.appendChild(matrixDeviceRow(v, waitingBy[v.device.id] || [])); });
      table.appendChild(body);
      room.appendChild(table);
      return;
    }

    hosts.forEach(function (h) {
      var sec = el("section", "bay");
      var hd = el("header", "bay-head");
      var hostOpen = el("button", "bay-name mono host-open", h);
      hostOpen.type = "button";
      hostOpen.setAttribute("data-workspace-kind", "host");
      hostOpen.setAttribute("data-workspace-id", h);
      hostOpen.addEventListener("click", function () { openHost(h); });
      hd.appendChild(hostOpen);
      var facts = hostSummary(byHost[h]);
      var heartbeat = null;
      byHost[h].forEach(function (v) {
        if (typeof v.heartbeat_age_seconds === "number" &&
            (heartbeat === null || v.heartbeat_age_seconds > heartbeat)) heartbeat = v.heartbeat_age_seconds;
      });
      if (heartbeat !== null) facts += " · heartbeat " + ago(heartbeat) + " ago";
      if (facts) hd.appendChild(el("span", "bay-facts", facts));
      sec.appendChild(hd);
      var bayBody = el("div", "bay-body");
      var rows = el("div", "rows");
      byHost[h].sort(function (a, b) { return a.device.id.localeCompare(b.device.id); })
        .forEach(function (v) { rows.appendChild(deviceRow(v, waitingBy[v.device.id] || [])); });
      bayBody.appendChild(rows);
      sec.appendChild(bayBody);
      room.appendChild(sec);
    });
  }

  function matrixDeviceRow(v, queuedFor) {
    var d = v.device;
    var row = el("tr", d.state);
    row.setAttribute("data-device-id", d.id);

    var deviceCell = el("td");
    var open = el("button", "matrix-open");
    open.type = "button";
    open.setAttribute("data-workspace-kind", "device");
    open.setAttribute("data-workspace-id", d.id);
    open.addEventListener("click", function () { openDevice(d.id); });
    open.appendChild(el("span", "matrix-id mono", d.id));
    open.appendChild(el("span", "matrix-meta", (d.host || "—") + (specLine(v) ? " · " + specLine(v) : "")));
    deviceCell.appendChild(open);
    row.appendChild(deviceCell);

    var work = el("td");
    if (v.holder) {
      work.appendChild(el("span", null, v.holder));
      work.appendChild(el("span", "matrix-meta mono", (v.job_id ? "job " + v.job_id.slice(0, 8) + " · " : "") + ago(v.elapsed_seconds)));
    } else if (queuedFor.length) {
      work.appendChild(el("span", null, queuedFor.length + (queuedFor.length === 1 ? " named job waiting" : " named jobs waiting")));
      work.appendChild(el("span", "matrix-meta", "longest " + ago(Math.max.apply(null, queuedFor.map(function (j) { return j.waited; })))));
    } else {
      work.appendChild(el("span", "matrix-meta", "No assigned work"));
    }
    row.appendChild(work);

    var state = el("td");
    state.appendChild(el("span", "pill " + d.state, stateWord(d.state)));
    if (d.state === "unhealthy") state.appendChild(el("span", "matrix-meta", explain(v.quarantine_reason).headline));
    row.appendChild(state);

    var actions = el("td");
    if (d.state === "unhealthy") {
      actions.appendChild(button("act danger", "Return to pool", function () {
        clearDevice(d.id, v.quarantine_reason);
      }));
    } else {
      actions.appendChild(button("act", "Open", function () { openDevice(d.id); }));
    }
    row.appendChild(actions);
    return row;
  }

  function deviceRow(v, queuedFor) {
    var d = v.device;
    var down = d.state === "unhealthy";
    var row = el("div", "row" + (down ? " down" : ""));
    row.setAttribute("data-device-id", d.id);

    // The rail runs the full height of the row, outside the button, so it is
    // a property of the row rather than of anything clickable inside it.
    row.appendChild(el("span", "rail " + d.state));

    var open = el("button", "open devrow");
    open.type = "button";
    open.setAttribute("data-workspace-kind", "device");
    open.setAttribute("data-workspace-id", d.id);
    open.addEventListener("click", function () { openDevice(d.id); });
    // The glyph, decorative and hidden from a screen reader: it repeats the
    // state and the hardware, both of which are already words further down
    // this row. It is here for the eye that is not reading.
    open.appendChild(glyphFor(v, "sm"));

    var body = el("div", "rowbody");

    var l1 = el("div", "line1");
    // The short name reads better in a list already grouped by host, but the
    // full ID is what an operator types into `rc run -d`, so keep it one
    // hover away rather than gone.
    var name = el("span", "dev mono", d.name || d.id);
    name.title = d.id;
    l1.appendChild(name);
    // The pill replaces the pip-and-word pair: the same two carriers, one
    // object, and the word is the part that survives if the colour does not.
    l1.appendChild(el("span", "pill " + d.state, stateWord(d.state)));
    var spec = specLine(v);
    if (spec) l1.appendChild(el("span", "spec", spec));
    body.appendChild(l1);

    // Who has it and for how long — the question this page exists to answer.
    if (v.holder) {
      var l2 = el("div", "line2");
      l2.appendChild(el("span", "who", v.holder));
      if (v.kind === "hold") l2.appendChild(txt(" is holding it" + (v.reason ? " — " + clip(v.reason, 60) : "")));
      if (v.job_id) l2.appendChild(el("span", "mono", " · job " + v.job_id.slice(0, 8)));
      l2.appendChild(el("span", "dur", " · " + ago(v.elapsed_seconds)));
      body.appendChild(l2);
    }

    // A worker that has gone quiet while still holding a claim is a ghost:
    // the row says "in use" but nobody is confirming it.
    if (v.heartbeat_age_seconds > 30) {
      var quiet = el("div", "line2");
      quiet.appendChild(el("span", "quiet",
        "nothing heard from this host for " + ago(v.heartbeat_age_seconds)));
      body.appendChild(quiet);
    }

    // The explanation, promoted above everything else on a device that is
    // out of the pool, because it decides whether returning it is safe.
    // Only the headline here: the host's own words can be long, and they
    // are one click away in full.
    if (down) {
      var reason = explain(v.quarantine_reason);
      var why = el("div", "why");
      why.appendChild(el("b", null, reason.headline));
      if (reason.quote) why.appendChild(el("span", "txt", clip(reason.quote, 160)));
      body.appendChild(why);
    }

    if (v.kind !== "hold" && v.command && v.command.length) {
      body.appendChild(el("div", "cmd mono", clip(v.command.join(" "), 200)));
    }

    if (queuedFor.length) {
      var w = el("div", "waits");
      queuedFor.forEach(function (j) {
        var line = el("span", "w" + (j.waited >= 600 ? " long" : ""));
        line.textContent = "waiting " + ago(j.waited) + " · " + j.submitter;
        w.appendChild(line);
      });
      body.appendChild(w);
    }

    open.appendChild(body);
    row.appendChild(open);

    var actions = el("div", "actions");
    if (down) {
      actions.appendChild(button("act danger", "Return to pool", function () {
        clearDevice(d.id, v.quarantine_reason);
      }));
    }
    // No kill control here: the work list below carries one for every
    // running job, and putting the same button in two places on the board
    // is exactly the instrumentation this page is trying not to be.
    actions.appendChild(el("span", "chev", "›"));
    row.appendChild(actions);
    return row;
  }

  function renderAttention(views, state) {
    var region = document.getElementById("attentionRegion");
    var items = document.getElementById("attentionItems");
    var incidents = [];

    views.forEach(function (v) {
      var d = v.device;
      if (d.state === "unhealthy") {
        incidents.push({
          title: (d.name || d.id) + " is out of the pool",
          detail: explain(v.quarantine_reason).headline,
          open: function () { openDevice(d.id); }
        });
      } else if (d.state === "unknown" && v.heartbeat_age_seconds > 30) {
        incidents.push({
          title: (d.name || d.id) + " is not reporting",
          detail: "Nothing heard for " + ago(v.heartbeat_age_seconds) + ". Check the worker on " + (d.host || "its host") + ".",
          open: function () { openDevice(d.id); }
        });
      }
    });
    (state.queued || []).forEach(function (j) {
      var waited = (state.queued_waiting_seconds || {})[j.id];
      if (typeof waited === "number" && waited >= 600) {
        incidents.push({
          title: "A queued job has waited " + ago(waited),
          detail: j.device_id ? "It names " + j.device_id + "." : "It is waiting for " + (j.selector || "an eligible device") + ".",
          open: function () { openJob(j.id); }
        });
      }
    });
    if (lastFetchAt && Date.now() - lastFetchAt > 30000) {
      incidents.push({
        title: "The controller connection is stale",
        detail: "The last fleet snapshot arrived " + ago(Math.floor((Date.now() - lastFetchAt) / 1000)) + " ago. Polling will keep trying."
      });
    }

    items.textContent = "";
    incidents.forEach(function (incident) {
      var item = incident.open ? el("button", "incident ev-open") : el("div", "incident");
      if (incident.open) {
        item.type = "button";
        item.addEventListener("click", incident.open);
      }
      item.appendChild(el("b", null, incident.title));
      item.appendChild(el("span", null, incident.detail));
      items.appendChild(item);
    });
    var visible = incidents.length > 0;
    region.classList.toggle("hide", !visible);
    document.getElementById("overviewGrid").classList.toggle("has-attention", visible);
  }

  // Work is the second half of the board: what is running right now and
  // what is waiting for a device, each one click from its own detail and
  // its live output. Running work is read off the device views because
  // their elapsed time is server-measured; queued work off the queue, for
  // the same reason.
  function renderWorkStrip(state, views) {
    var box = document.getElementById("work");
    var section = document.getElementById("workStrip");
    box.textContent = "";

    var running = views.filter(function (v) { return v.job_id; });
    var queued = state.queued || [];
    if (!running.length && !queued.length) {
      section.classList.add("hide");
      return;
    }
    section.classList.remove("hide");

    var rows = el("div", "rows");
    running.forEach(function (v) { rows.appendChild(workRow(v, null, state)); });
    queued.forEach(function (j) { rows.appendChild(workRow(null, j, state)); });
    box.appendChild(rows);
  }

  // This mirrors the controller's supported selector subset. A highlight is
  // a scheduling claim, so malformed expressions and facts a device did not
  // report are never treated as eligibility.
  function selectorQuantity(value) {
    var text = String(value).trim();
    if (!text) return null;
    var multiplier = 1;
    var suffix = text.charAt(text.length - 1).toUpperCase();
    var powers = { K: 1024, M: 1048576, G: 1073741824, T: 1099511627776 };
    if (powers[suffix]) {
      multiplier = powers[suffix];
      text = text.slice(0, -1).trim();
    }
    if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/.test(text)) return null;
    var number = Number(text);
    return isFinite(number) ? number * multiplier : null;
  }

  function selectorEligible(selector, view) {
    if (!selector || !view) return false;
    var labels = labelMap(view);
    var terms = selector.split(",");
    for (var i = 0; i < terms.length; i++) {
      var match = terms[i].trim().match(/^([^=!<>\s]+)\s*(!=|>=|<=|=)\s*([^=!<>]+?)\s*$/);
      if (!match || !Object.prototype.hasOwnProperty.call(labels, match[1])) return false;
      var have = String(labels[match[1]]), want = match[3].trim(), op = match[2];
      if (!want) return false;
      var haveQuantity = selectorQuantity(have), wantQuantity = selectorQuantity(want);
      var bothNumeric = haveQuantity !== null && wantQuantity !== null;
      if ((op === ">=" || op === "<=") && !bothNumeric &&
          ((haveQuantity !== null) !== (wantQuantity !== null))) return false;
      var left = bothNumeric ? haveQuantity : have;
      var right = bothNumeric ? wantQuantity : want;
      if (op === "=" && left !== right) return false;
      if (op === "!=" && left === right) return false;
      if (op === ">=" && !(left >= right)) return false;
      if (op === "<=" && !(left <= right)) return false;
    }
    return terms.length > 0;
  }

  function eligibleDeviceIDs(job) {
    if (!job) return [];
    if (job.device_id) return [job.device_id];
    if (!job.selector) return [];
    return Object.keys(deviceIndex).filter(function (id) {
      return selectorEligible(job.selector, deviceIndex[id]);
    });
  }

  function highlightWorkDevices(job, on) {
    var ids = on ? eligibleDeviceIDs(job) : [];
    document.querySelectorAll("#machineRoom [data-device-id]").forEach(function (row) {
      row.classList.toggle("work-match", ids.indexOf(row.getAttribute("data-device-id")) !== -1);
    });
  }

  function workRow(view, queuedJob, state) {
    var row = el("div", "row");
    var open = el("button", "open");
    open.type = "button";

    var jobID = view ? view.job_id : queuedJob.id;
    var submitter = view ? view.holder : queuedJob.submitter;
    var device = view ? view.device.id : (queuedJob.device_id || "");
    var isHold = view ? view.kind === "hold" : queuedJob.kind === "hold";
    var target = view ? { device_id: view.device.id } : queuedJob;
    open.setAttribute("data-workspace-kind", "job");
    open.setAttribute("data-workspace-id", jobID);
    open.addEventListener("mouseenter", function () { highlightWorkDevices(target, true); });
    open.addEventListener("mouseleave", function () { highlightWorkDevices(target, false); });
    open.addEventListener("focus", function () { highlightWorkDevices(target, true); });
    open.addEventListener("blur", function () { highlightWorkDevices(target, false); });
    open.addEventListener("click", function () {
      highlightWorkDevices(target, true);
      openJob(jobID);
    });

    var l1 = el("div", "line1");
    l1.appendChild(el("span", "pip" + (view ? " busy" : "")));
    l1.appendChild(el("span", "dev", submitter || "—"));
    if (view) {
      l1.appendChild(el("span", "state busy", isHold ? "holding" : "running"));
      l1.appendChild(el("span", "spec", ago(view.elapsed_seconds)));
    } else {
      var waited = (state.queued_waiting_seconds || {})[queuedJob.id] || 0;
      // Waiting is not a fault, so it is grey until it has gone on long
      // enough to be one.
      l1.appendChild(el("span", "state waiting", "waiting for a device"));
      // A wait past ten minutes is the case a snapshot could never show,
      // and the one worth colouring.
      l1.appendChild(el("span", "spec" + (waited >= 600 ? " long" : ""), ago(waited)));
    }
    open.appendChild(l1);

    var l2 = el("div", "line2");
    l2.appendChild(el("span", "dur", device ? device
      : (queuedJob && queuedJob.selector ? "any device matching " + clip(queuedJob.selector, 60)
                                         : "no device yet")));
    open.appendChild(l2);

    // The command, one dim line, never wider than its column.
    var cmd = view ? (view.kind === "hold" ? "hold" + (view.reason ? " — " + view.reason : "")
                                           : (view.command || []).join(" "))
                   : commandText(queuedJob);
    if (cmd) open.appendChild(el("div", "cmd mono", clip(cmd, 200)));

    row.appendChild(open);

    var actions = el("div", "actions");
    if (identity) {
      var mine = submitter === identity;
      var kill = button("act" + (mine ? "" : " foreign"), isHold ? "Release" : "Kill", function () {
        killJob({ id: jobID, device_id: device, submitter: submitter });
      });
      if (!mine) kill.title = "submitted by " + submitter +
        ": the controller refuses a kill from anyone else";
      actions.appendChild(kill);
    }
    actions.appendChild(el("span", "chev", "›"));
    row.appendChild(actions);
    return row;
  }

  // ---- entity workspaces ------------------------------------------------

  var workspaceView = { kind: "fleet" };
  var workspaceBody = document.getElementById("workspaceBody");
  var workspaceLife = document.getElementById("workspaceLife");
  var workspaceMain = document.getElementById("workspaceMain");
  var workspaceOutput = document.getElementById("workspaceOutput");
  var workspaceHeading = document.getElementById("workspaceHeading");
  var workspaceTrigger = null;
  var workspaceTriggerView = null;
  var overviewScrollY = 0;
  var overviewMode = "day";
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  var jobWorkspaceTab = "details";
  var jobWorkspaceTabID = null;

  function routeHash(view) {
    if (view.kind === "fleet") return "#fleet";
    if (view.kind === "running") return "#running";
    if (view.kind === "host") return "#host/" + encodeURIComponent(view.id);
    if (view.kind === "device") return "#device/" + encodeURIComponent(view.id);
    return "#job/" + encodeURIComponent(view.id);
  }

  function navigateTo(view, options) {
    options = options || {};
    if (view.kind !== "fleet" && workspaceView.kind === "fleet") {
      overviewScrollY = window.scrollY;
      overviewMode = fleetMode;
      workspaceTrigger = document.activeElement;
      workspaceTriggerView = view;
    }
    if (workspaceView.kind !== view.kind || workspaceView.id !== view.id) {
      dropLogBlock();
      stopRunTails();
    }
    if (view.kind === "job") jobWorkspaceTabFor(view.id);
    var previousKind = workspaceView.kind;
    workspaceView = view;
    if (!options.fromHash && window.location.hash !== routeHash(view)) {
      if (previousKind !== "fleet" && view.kind !== "fleet") {
        window.history.replaceState(null, "", routeHash(view));
        renderWorkspace();
        return;
      }
      window.location.hash = routeHash(view);
      return;
    }
    renderWorkspace();
  }

  function routeFromHash() {
    if (!window.location.hash) window.history.replaceState(null, "", "#fleet");
    var raw = window.location.hash || "#fleet";
    if (raw === "#fleet" || raw === "#") { navigateTo({ kind: "fleet" }, { fromHash: true }); return; }
    if (raw === "#running") { navigateTo({ kind: "running" }, { fromHash: true }); return; }
    var match = /^#(host|device|job)\/(.+)$/.exec(raw);
    if (!match) {
      window.history.replaceState(null, "", "#fleet");
      navigateTo({ kind: "fleet" }, { fromHash: true });
      return;
    }
    try {
      navigateTo({ kind: match[1], id: decodeURIComponent(match[2]) }, { fromHash: true });
    } catch (e) {
      window.history.replaceState(null, "", "#fleet");
      navigateTo({ kind: "fleet" }, { fromHash: true });
    }
  }

  function openHost(host) { navigateTo({ kind: "host", id: host }); }
  function openDevice(id) { navigateTo({ kind: "device", id: id }); }
  function openJob(id) { navigateTo({ kind: "job", id: id }); }

  function closeWorkspace() {
    resetJobWorkspaceTab();
    window.history.replaceState(null, "", "#fleet");
    navigateTo({ kind: "fleet" }, { fromHash: true });
  }

  function handleWorkspaceKeydown(e) {
    if (e.key === "Escape" && workspaceView.kind !== "fleet") closeWorkspace();
  }

  function jobWorkspaceTabFor(id) {
    if (jobWorkspaceTabID !== id) {
      jobWorkspaceTabID = id;
      jobWorkspaceTab = "details";
    }
    return jobWorkspaceTab;
  }

  function selectJobWorkspaceTab(id, name) {
    jobWorkspaceTabFor(id);
    jobWorkspaceTab = name === "output" ? "output" : "details";
    return jobWorkspaceTab;
  }

  function resetJobWorkspaceTab() {
    jobWorkspaceTabID = null;
    jobWorkspaceTab = "details";
  }

  function buildJobWorkspaceTabs(id, columns) {
    var tabs = el("div", "workspace-tabs");
    tabs.setAttribute("role", "tablist");
    function select(name, detailButton, outputButton) {
      name = selectJobWorkspaceTab(id, name);
      columns.setAttribute("data-tab", name);
      workspaceBody.setAttribute("data-tab", name);
      detailButton.setAttribute("aria-selected", String(name === "details"));
      outputButton.setAttribute("aria-selected", String(name === "output"));
    }
    var detailTab = button(null, "Details", function () { select("details", detailTab, outputTab); });
    var outputTab = button(null, "Output", function () { select("output", detailTab, outputTab); });
    detailTab.setAttribute("role", "tab");
    outputTab.setAttribute("role", "tab");
    select(jobWorkspaceTabFor(id), detailTab, outputTab);
    tabs.appendChild(detailTab);
    tabs.appendChild(outputTab);
    return tabs;
  }

  function transitionWorkspace(node) {
    if (reduceMotion.matches) { node.style.opacity = "1"; return; }
    node.style.opacity = "0";
    if (window.anime && anime.animate) {
      anime.animate(node, { opacity: [0, 1], duration: 180, ease: "out(2)" });
    } else {
      node.style.opacity = "1";
    }
  }

  function findWorkspaceTrigger() {
    if (!workspaceTriggerView) return null;
    var candidates = document.querySelectorAll("[data-workspace-kind][data-workspace-id]");
    for (var i = 0; i < candidates.length; i++) {
      if (candidates[i].getAttribute("data-workspace-kind") === workspaceTriggerView.kind &&
          candidates[i].getAttribute("data-workspace-id") === workspaceTriggerView.id) return candidates[i];
    }
    return null;
  }

  function renderWorkspace(options) {
    options = options || {};
    var currentScrollY = window.scrollY;
    var overview = document.getElementById("fleetOverview");
    var who = document.getElementById("whoBar");
    var workspace = document.getElementById("workspace");
    if (workspaceView.kind === "fleet") {
      workspace.classList.add("hide");
      document.getElementById("runningView").classList.add("hide");
      overview.classList.remove("hide");
      who.classList.remove("hide");
      setFleetMode(overviewMode);
      window.scrollTo(0, overviewScrollY);
      if (!workspaceTrigger || !document.contains(workspaceTrigger)) workspaceTrigger = findWorkspaceTrigger();
      if (workspaceTrigger) workspaceTrigger.focus();
      if (!options.preserve) transitionWorkspace(overview);
      return;
    }

    var runningView = document.getElementById("runningView");
    if (workspaceView.kind === "running") {
      overview.classList.add("hide");
      who.classList.add("hide");
      workspace.classList.add("hide");
      runningView.classList.remove("hide");
      renderRunning();
      if (options.preserve) {
        window.scrollTo(0, currentScrollY);
      } else {
        window.scrollTo(0, 0);
        document.getElementById("runningHeading").focus();
        transitionWorkspace(runningView);
      }
      return;
    }
    runningView.classList.add("hide");

    overview.classList.add("hide");
    who.classList.add("hide");
    workspace.classList.remove("hide");
    // Not workspaceBody. The output pane inside it holds a live stream and
    // the reader's scroll position, and removing an element from the document
    // resets scrollTop on every scroller inside it — which is precisely how
    // follow mode has been dying every five seconds since it was written. The
    // facts around it are rebuilt; the stream is left where it is.
    // Every workspace renders into workspaceMain, never into workspaceBody:
    // the body holds the persistent output pane as a sibling, so anything
    // appended to the body directly is never cleared and duplicates itself on
    // every refresh.
    workspaceLife.textContent = "";
    workspaceMain.textContent = "";
    workspaceBody.classList.toggle("job-layout", workspaceView.kind === "job");
    if (workspaceView.kind !== "job") {
      workspaceOutput.textContent = "";
      workspaceOutput.classList.add("hide");
    }
    document.getElementById("workspaceKind").textContent = workspaceView.kind;
    if (workspaceView.kind === "host") renderHostWorkspace(workspaceView.id);
    else if (workspaceView.kind === "device") renderDeviceWorkspace(workspaceView.id);
    else renderJobWorkspace(workspaceView.id);
    if (options.preserve) {
      window.scrollTo(0, currentScrollY);
    } else {
      window.scrollTo(0, 0);
      workspaceHeading.focus();
      transitionWorkspace(workspace);
    }
  }

  function renderHostWorkspace(host) {
    workspaceHeading.textContent = host;
    var views = Object.keys(deviceIndex).map(function (id) { return deviceIndex[id]; })
      .filter(function (v) { return (v.device.host || "—") === host; });
    if (!views.length) {
      workspaceMain.appendChild(el("p", "under", "This host is no longer in the fleet."));
      return;
    }
    var unhealthy = views.filter(function (v) { return v.device.state === "unhealthy"; });
    var quiet = views.filter(function (v) { return v.heartbeat_age_seconds > 30; });
    if (unhealthy.length || quiet.length) {
      var diagnosis = el("div", "note " + (unhealthy.length ? "alarm" : "caution"));
      diagnosis.appendChild(el("h3", null, unhealthy.length ? "This host needs intervention." : "This host is not reporting reliably."));
      diagnosis.appendChild(el("p", null, unhealthy.length
        ? unhealthy.length + (unhealthy.length === 1 ? " device is" : " devices are") + " out of the pool."
        : "Nothing has been heard from at least one device for more than 30 seconds."));
      // Two cards do not fail in the same second. When every lane on a host
      // goes quiet together, the host stopped talking — say so, because the
      // action is a worker restart rather than anything to do with the
      // hardware. This is an inference from the state the controller has, not
      // a heartbeat history it keeps, and it is worded as one.
      if (!unhealthy.length && quiet.length === views.length && views.length > 1) {
        diagnosis.appendChild(el("p", null,
          "All " + views.length + " devices on this host went quiet together, so this is " +
          "almost certainly the worker rather than the hardware. Nothing will be scheduled " +
          "here until it checks in."));
      }
      workspaceMain.appendChild(diagnosis);
    }
    // The host's day, and how much of it these cards actually worked. Both
    // come out of the job history already in hand.
    var win = dayWindow(controllerNow(), dayWindowHours);
    var jobs = dayJobs(latest || {});
    workspaceMain.appendChild(utilisationBlock(views, jobs, win, controllerNow()));
    workspaceMain.appendChild(workspaceTimeline(views, "This host today"));

    var facts = el("dl", "facts");
    facts.appendChild(el("dt", null, "devices"));
    facts.appendChild(el("dd", null, String(views.length)));
    facts.appendChild(el("dt", null, "summary"));
    facts.appendChild(el("dd", null, hostSummary(views)));
    var factsBlock = el("div", "block");
    factsBlock.appendChild(el("h3", "sec", "Host facts"));
    factsBlock.appendChild(facts);
    workspaceMain.appendChild(factsBlock);

    var labels = el("dl", "facts");
    (views[0].device.labels || []).forEach(function (label) {
      labels.appendChild(el("dt", null, prettyKey(label.key)));
      var value = el("dd", null, prettyValue(label.key, label.value));
      value.appendChild(el("span", "src", label.source === "declared" ? "written by hand" : "detected"));
      value.appendChild(el("span", "src", typeof views[0].oldest_label_age_seconds === "number"
        ? "seen " + ago(views[0].oldest_label_age_seconds) + " ago" : "age unknown"));
      labels.appendChild(value);
    });
    var labelBlock = el("div", "block");
    labelBlock.appendChild(el("h3", "sec", "Labels and provenance"));
    labelBlock.appendChild(labels);
    workspaceMain.appendChild(labelBlock);

    var devices = el("div", "host-devices");
    devices.appendChild(el("h3", "sec", "Related devices"));
    var rows = el("div", "rows");
    views.forEach(function (v) { rows.appendChild(deviceRow(v, [])); });
    devices.appendChild(rows);
    workspaceMain.appendChild(devices);

    var extras = el("div", "host-extras");
    workspaceMain.appendChild(extras);
    paintHostWorkspaceExtras(extras, views);
    fetchHostWorkspaceData(host, views).then(function () {
      if (workspaceView.kind === "host" && workspaceView.id === host) {
        paintHostWorkspaceExtras(extras, views);
      }
    });
  }

  function fetchHostWorkspaceData(host, views) {
    return Promise.all(views.map(function (v) {
      var id = v.device.id;
      return fetch("/v1/devices/" + encodeURIComponent(id) + "/describe", { headers: authHeaders() })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (!data) return null;
          data.fetchedAt = Date.now();
          describes[id] = data;
          return data;
        }).catch(function () { return null; });
    })).then(function (all) {
      var seen = {};
      var recent = [];
      all.forEach(function (data) {
        ((data && data.recent_jobs) || []).forEach(function (job) {
          if (!job || !job.id) return;
          jobIndex[job.id] = job;
          if (!seen[job.id]) { seen[job.id] = true; recent.push(job); }
        });
      });
      return recent;
    });
  }

  function paintHostWorkspaceExtras(box, views) {
    box.textContent = "";
    var sheetData = null;
    views.some(function (v) {
      var data = describes[v.device.id];
      if (data && data.sheet) { sheetData = data; return true; }
      return false;
    });
    if (sheetData) {
      var usage = el("div", "block");
      usage.appendChild(el("h3", "sec", "Usage sheet" +
        (typeof sheetData.sheet_age_seconds === "number" ? " · written " + ago(sheetData.sheet_age_seconds) + " ago" : "")));
      var sheet = el("div", "sheet");
      sheet.appendChild(renderMarkdown(sheetData.sheet));
      usage.appendChild(sheet);
      box.appendChild(usage);
    }
    var deviceIDs = {};
    views.forEach(function (v) { deviceIDs[v.device.id] = true; });
    var recent = Object.keys(jobIndex).map(function (id) { return jobIndex[id]; })
      .filter(function (job) { return job.device_id && deviceIDs[job.device_id]; }).slice(0, 10);
    if (!recent.length) return;
    var history = el("div", "block");
    history.appendChild(el("h3", "sec", "Recent jobs"));
    recent.forEach(function (job) {
      history.appendChild(button("jrow", jobStateShort(job.state) + " · " + clip(commandText(job), 160), function () { openJob(job.id); }));
    });
    box.appendChild(history);
  }

  function renderDeviceWorkspace(id) {
    workspaceHeading.textContent = id;
    var v = deviceIndex[id];
    if (!v) {
      workspaceMain.appendChild(el("p", "under", "This device is no longer in the fleet."));
      return;
    }
    var d = v.device;

    workspaceMain.appendChild(el("p", "big " + d.state, stateWord(d.state)));
    var under = el("p", "under");
    if (v.holder) {
      under.appendChild(txt((v.kind === "hold" ? "held by " : "running work for ") + v.holder +
        " for " + ago(v.elapsed_seconds)));
    } else if (d.state === "ready") {
      under.appendChild(txt("nothing is using it"));
    } else if (d.state === "unknown") {
      under.appendChild(txt("nothing heard from this host for " + ago(v.heartbeat_age_seconds)));
    }
    if (d.host) {
      under.appendChild(txt(" · "));
      under.appendChild(button("linkish", d.host, function () { openHost(d.host); }));
    }
    workspaceMain.appendChild(under);

    // Why it is out of the pool, in full: headline, the host's own words
    // verbatim, and what to do next. This is the reason this panel exists.
    var flapNote = null;
    if (d.state === "unhealthy") {
      var reason = explain(v.quarantine_reason);
      var note = el("div", "note alarm");
      note.appendChild(el("h3", null, reason.headline));
      if (reason.body) note.appendChild(el("p", null, reason.body));
      if (reason.quote) note.appendChild(el("span", "quote", reason.quote));
      if (reason.advice) note.appendChild(el("p", null, reason.advice));
      // Whether this is the first time or the last straw. Painted from the
      // describe cache immediately and again when a fresh read lands.
      flapNote = el("p");
      note.appendChild(flapNote);
      paintRecoveries(flapNote, describes[id]);
      workspaceMain.appendChild(note);
    } else if (v.heartbeat_age_seconds > 30 && v.holder) {
      var stale = el("div", "note caution");
      stale.appendChild(el("h3", null, "Nobody is confirming this work."));
      stale.appendChild(el("p", null, "The host has not been heard from for " +
        ago(v.heartbeat_age_seconds) + ", so what is shown here may already be over."));
      workspaceMain.appendChild(stale);
    }

    // Current work, one click away.
    if (v.job_id) {
      var block = el("div", "block");
      block.appendChild(el("h3", "sec", "Current work"));
      var jobBtn = el("button", "jrow");
      jobBtn.type = "button";
      jobBtn.addEventListener("click", function () { openJob(v.job_id); });
      jobBtn.appendChild(el("span", "jst", v.kind === "hold" ? "holding" : "running"));
      jobBtn.appendChild(el("span", "jwho", v.holder || "—"));
      jobBtn.appendChild(el("span", "jcmd mono",
        clip(v.kind === "hold" ? (v.reason || "hold") : (v.command || []).join(" "), 200)));
      block.appendChild(jobBtn);
      workspaceMain.appendChild(block);
    }

    // Actions, gathered rather than scattered.
    var actions = el("div", "block");
    var actionRow = el("div", "line1");
    if (d.state === "unhealthy") {
      actionRow.appendChild(button("act danger", "Return to pool", function () {
        clearDevice(d.id, v.quarantine_reason);
      }));
    }
    if (!v.holder) {
      var retire = button("act", "Retire", function () { retireDevice(d.id); });
      retire.title = "remove " + d.id + " from the fleet (admin)";
      actionRow.appendChild(retire);
    }
    if (actionRow.childNodes.length) {
      actions.appendChild(actionRow);
      workspaceMain.appendChild(actions);
    }

    // The hardware portrait: which machine this actually is, drawn rather
    // than spelled, with its one spec line and how much of it is spoken for.
    //
    // It sits here, below the state and the reason and above everything the
    // controller knows about the device, because the two modes want opposite
    // things: diagnosis wants the answer first, and this is not the answer —
    // it is what the answer is about. So the alarm keeps the top of the
    // panel, and the portrait heads the facts.
    workspaceMain.appendChild(portrait(v));

    // This card's own day, on the same renderer the fleet chart uses.
    var devWin = dayWindow(controllerNow(), dayWindowHours);
    var devJobs = dayJobs(latest || {});
    workspaceMain.appendChild(utilisationBlock([v], devJobs, devWin, controllerNow()));
    workspaceMain.appendChild(workspaceTimeline([v], "This card today"));

    // Facts, with provenance. describe is painted from cache first so
    // reopening a device never flashes empty, and refetched only when what
    // is cached has had time to go stale — this panel is rebuilt on every
    // five-second refresh, and a per-device store query on each of those
    // would be a poll nobody asked for.
    var factsBox = el("div", "block");
    workspaceMain.appendChild(factsBox);
    var cached = describes[id];
    paintDescribe(factsBox, v, cached);
    if (cached && Date.now() - cached.fetchedAt < 15000) return;

    fetch("/v1/devices/" + encodeURIComponent(id) + "/describe", { headers: authHeaders() })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        data.fetchedAt = Date.now();
        describes[id] = data;
        if (workspaceView.kind === "device" && workspaceView.id === id) {
          paintDescribe(factsBox, v, data);
          paintRecoveries(flapNote, data);
        }
      })
      .catch(function () { /* the labels from /v1/state still stand */ });
  }

  // How the flap guard sees this device.
  //
  // A quarantined device reads identically whether this is its first failure
  // or its last straw, and those call for different actions: one is "clear it
  // and move on", the other is "stop clearing it and look at the hardware".
  // The controller has always counted this to decide whether to heal the
  // device itself; describe is where a reader finally sees the same number.
  function paintRecoveries(node, data) {
    if (!node) return;
    node.textContent = "";
    if (!data || typeof data.recoveries_remaining !== "number") return;
    var used = (data.recoveries || []).length;
    // ago() renders an hour as "1h 0m", which reads badly mid-sentence.
    var secs = data.recovery_window_seconds || 0;
    var window = !secs ? "the guard's window"
      : secs % 3600 === 0 ? (secs / 3600) + (secs === 3600 ? " hour" : " hours")
      : ago(secs);
    if (!used) {
      node.appendChild(txt("It has not come back on its own in the last " + window +
        ", so this is the first time it has needed attention today."));
      return;
    }
    var when = (data.recoveries || []).map(function (r) { return clockAt(instant(r.at)); }).join(", ");
    node.appendChild(txt("It came back on its own " + used +
      (used === 1 ? " time" : " times") + " in the last " + window + " — at " + when + ". "));
    if (data.recoveries_remaining > 0) {
      node.appendChild(txt(data.recoveries_remaining +
        (data.recoveries_remaining === 1 ? " automatic return remains" : " automatic returns remain") +
        " before it stops doing that."));
    } else {
      node.appendChild(el("b", null,
        "It has used up its automatic returns and will not come back by itself — a person has to clear it."));
    }
  }

  function portrait(v) {
    var d = v.device;
    var card = el("div", "portrait" + (d.state === "unhealthy" ? " unhealthy" : ""));

    var top = el("div", "ptop");
    var head = el("div");
    // The full ID here, not the short name: the panel is where an operator
    // copies the thing they will type into `rc run -d`.
    head.appendChild(el("div", "pname mono", d.id));
    head.appendChild(el("div", "pspec", portraitSpec(v)));
    top.appendChild(head);
    top.appendChild(glyphFor(v, "lg"));
    card.appendChild(top);

    var c = claim(v);
    var meter = el("div", "meter");
    // Hidden from a screen reader on purpose: the two lines under it say
    // the same thing in words, and a bar with no accessible value is worse
    // than no bar at all.
    meter.setAttribute("aria-hidden", "true");
    var fill = el("i", c.tone);
    fill.style.width = c.pct + "%";
    meter.appendChild(fill);
    card.appendChild(meter);

    var foot = el("div", "pfoot");
    foot.appendChild(el("span", null, c.what));
    foot.appendChild(el("span", "tnum", c.when));
    card.appendChild(foot);
    return card;
  }

  function relatedDeviceViews(v) {
    var host = v && v.device && v.device.host;
    if (!host) return [];
    return Object.keys(deviceIndex).map(function (id) { return deviceIndex[id]; })
      .filter(function (other) { return other.device.id !== v.device.id && other.device.host === host; })
      .sort(function (a, b) { return a.device.id.localeCompare(b.device.id); });
  }

  function paintDescribe(box, v, data) {
    box.textContent = "";

    var labels = ((data && data.labels) || (v.device && v.device.labels) || []).slice()
      .sort(function (a, b) { return a.key < b.key ? -1 : a.key > b.key ? 1 : 0; });
    var ages = (data && data.label_age_seconds) || null;

    box.appendChild(el("h3", "sec", "What this is"));
    if (!labels.length) {
      box.appendChild(el("p", "under", "Nothing has reported any facts about this device."));
    } else {
      var dl = el("dl", "facts");
      labels.forEach(function (l) {
        dl.appendChild(el("dt", null, prettyKey(l.key)));
        var dd = el("dd", null, prettyValue(l.key, l.value));
        // "detected" means a probe on the host found it; "declared" means
        // the operator wrote it into the worker's config. A hand-written
        // value that survived a hardware change is worse than none, so the
        // difference is always shown.
        dd.appendChild(el("span", "src", l.source === "declared" ? "written by hand" : "detected"));
        // An age missing from the map is an explicit unknown, never a
        // zero: "0s ago" is indistinguishable from the freshest possible
        // reading, which is exactly the confusion this guards against.
        if (ages) {
          var key = l.key + "/" + l.source;
          var age = Object.prototype.hasOwnProperty.call(ages, key) ? ages[key] : null;
          dd.appendChild(el("span", "src", age === null ? "age unknown" : "seen " + ago(age) + " ago"));
        }
        dl.appendChild(dd);
      });
      box.appendChild(dl);
    }
    if (typeof v.oldest_label_age_seconds === "number" && v.oldest_label_age_seconds > 3600) {
      box.appendChild(el("div", "agewarn",
        "Nothing has confirmed these facts for " + ago(v.oldest_label_age_seconds) + "."));
    }

    if (data && data.sheet) {
      var sheetBlock = el("div", "block");
      sheetBlock.style.marginTop = "20px";
      sheetBlock.appendChild(el("h3", "sec",
        (data.sheet_is_host_wide ? "How to use this host" : "How to use this device") +
        (typeof data.sheet_age_seconds === "number" ? " · written " + ago(data.sheet_age_seconds) + " ago" : "")));
      var sheet = el("div", "sheet");
      sheet.appendChild(renderMarkdown(data.sheet));
      sheetBlock.appendChild(sheet);
      box.appendChild(sheetBlock);
    }

    var related = relatedDeviceViews(v);
    if (related.length) {
      var relatedBlock = el("div", "block");
      relatedBlock.style.marginTop = "20px";
      relatedBlock.appendChild(el("h3", "sec", "Related devices"));
      var relatedRows = el("div", "rows");
      related.forEach(function (other) { relatedRows.appendChild(deviceRow(other, [])); });
      relatedBlock.appendChild(relatedRows);
      box.appendChild(relatedBlock);
    }

    // Recent history answers the question a single state cannot: "has this
    // box been failing?" A device that is ready right now and failed its
    // last three jobs is not the same device as one that is simply ready.
    // The job it is running right now is already shown above, so it is not
    // repeated here.
    var recent = ((data && data.recent_jobs) || []).filter(function (j) { return j.id !== v.job_id; });
    if (recent.length) {
      var hist = el("div", "block");
      hist.style.marginTop = "20px";
      hist.appendChild(el("h3", "sec", "Recently on this device"));
      recent.forEach(function (j) {
        jobIndex[j.id] = j;
        var line = el("button", "jrow");
        line.type = "button";
        line.addEventListener("click", function () { openJob(j.id); });
        line.appendChild(el("span", "jst " + jobStateClass(j.state), jobStateShort(j.state)));
        line.appendChild(el("span", "jwho", j.submitter || "—"));
        line.appendChild(el("span", "jcmd mono", clip(commandText(j), 200)));
        hist.appendChild(line);
      });
      box.appendChild(hist);
    }
  }

  function renderJobWorkspace(id) {
    workspaceHeading.textContent = "job " + id.slice(0, 8);
    var known = jobIndex[id];
    var meta = el("div");
    workspaceMain.appendChild(meta);
    if (known) paintJob(meta, id, known, null);
    else meta.appendChild(el("p", "under", "loading…"));

    fetch("/v1/jobs/" + encodeURIComponent(id), { headers: authHeaders() })
      .then(function (r) {
        if (!r.ok) return serverError(r).then(function (m) { throw new Error(m); });
        return r.json();
      })
      .then(function (v) {
        jobIndex[id] = v.job;
        if (workspaceView.kind === "job" && workspaceView.id === id) {
          paintJob(meta, id, v.job, v.queue_position);
        }
      })
      .catch(function (e) {
        if (!known && workspaceView.kind === "job" && workspaceView.id === id) {
          meta.textContent = "";
          meta.appendChild(el("p", "under", "This job could not be read: " + e.message));
        }
      });
  }

  // ---- utilization ------------------------------------------------------
  //
  // Derived from the job records the bars are drawn from, so it needs no
  // endpoint, no stored metric and no time series. It is exact for the window
  // it states, which is why it always states one.
  function utilisation(views, jobs, win, nowMs) {
    var span = Math.max(1, (Math.min(win.to, nowMs) - win.from) / 1000);
    var busy = 0, jobCount = 0, unfinished = 0;
    views.forEach(function (v) {
      busy += busySeconds(jobs, v.device.id, win.from, Math.min(win.to, nowMs), nowMs);
    });
    jobs.forEach(function (j) {
      var mine = views.some(function (v) { return v.device.id === j.device_id; });
      if (!mine) return;
      jobCount++;
      if (j.state === "failed" || j.state === "lost") unfinished++;
    });
    return {
      percent: views.length ? Math.round(busy / (span * views.length) * 100) : 0,
      busySeconds: busy,
      windowSeconds: Math.round(span),
      jobs: jobCount,
      unfinished: unfinished
    };
  }

  function utilisationBlock(views, jobs, win, nowMs) {
    var u = utilisation(views, jobs, win, nowMs);
    var cells = el("div", "cells");
    function cell(value, label, tone) {
      var c = el("div", "cell");
      c.appendChild(el("div", "n" + (tone ? " " + tone : ""), value));
      c.appendChild(el("div", "l", label));
      return c;
    }
    var busyCell = cell(u.percent + "%",
      (views.length === 1 ? "of the last " : "of the last ") + ago(u.windowSeconds) +
      (views.length === 1 ? " this card was held" : " these cards were held"));
    var bar = el("div", "ubar");
    var fill = el("i");
    fill.style.width = Math.min(100, u.percent) + "%";
    bar.appendChild(fill);
    busyCell.appendChild(bar);
    cells.appendChild(busyCell);
    cells.appendChild(cell(String(u.jobs), u.jobs === 1 ? "job in the window" : "jobs in the window"));
    cells.appendChild(cell(String(u.unfinished), "did not finish cleanly",
      u.unfinished ? "bad" : "ok"));
    var block = el("div", "block");
    block.appendChild(el("h3", "sec", "This window"));
    block.appendChild(cells);
    return block;
  }

  // One lane, or a host's lanes, drawn by the fleet chart's own renderer so
  // the two cannot drift apart.
  function workspaceTimeline(views, title) {
    var block = el("div", "block");
    block.appendChild(el("h3", "sec", title));
    block.appendChild(dayChart(views, latest || {}, { hostRows: false }));
    block.appendChild(dayLegend());
    return block;
  }

  // ---- running now ------------------------------------------------------
  //
  // Every active lease on one screen. Watching three jobs used to mean opening
  // three pages one at a time and reading them in turn.
  //
  // This is the screen most able to leak readers on the controller: one log
  // stream per visible run, all of them held open for as long as the view is.
  // So the tails are short, bounded, and dropped the instant the view changes
  // — see stopRunTails, which navigateTo calls on every move.

  // job id -> the card on screen and the reader feeding its tail. Keyed,
  // not rebuilt: a state refresh repaints this view every five seconds, and
  // recreating the cards would abort and restart every stream on the fleet —
  // the same mistake as re-parenting the job log, one level up. Cards are
  // updated in place and only a run that has actually ended loses its reader.
  var runCards = {};
  var TAIL_LINES = 3;     // lines of output kept per run
  var TAIL_CAP = 8000;    // characters held before the buffer is trimmed

  function stopRunTails() {
    Object.keys(runCards).forEach(function (id) {
      runCards[id].abort();
      if (runCards[id].root.parentNode) runCards[id].root.parentNode.removeChild(runCards[id].root);
    });
    runCards = {};
  }

  function startRunTail(id, pane, entry) {
    var ctrl = new AbortController();
    entry.abort = function () { ctrl.abort(); };
    var buf = "";
    function paint(chunk) {
      if (!chunk) return;
      buf += chunk;
      if (buf.length > TAIL_CAP) buf = buf.slice(buf.length - TAIL_CAP);
      var lines = buf.split("\n").filter(function (l) { return l.length > 0; });
      pane.textContent = lines.slice(-TAIL_LINES).join("\n");
    }
    fetch("/v1/jobs/" + encodeURIComponent(id) + "/logs",
          { headers: authHeaders(), signal: ctrl.signal })
      .then(function (r) {
        if (!r.ok || !r.body) { pane.textContent = "no output yet"; return; }
        var reader = r.body.getReader();
        var decoder = new TextDecoder();
        function pump() {
          return reader.read().then(function (res) {
            if (ctrl.signal.aborted) { reader.cancel(); return; }
            if (res.done) { paint(decoder.decode()); return; }
            paint(decoder.decode(res.value, { stream: true }));
            return pump();
          });
        }
        return pump();
      })
      .catch(function (e) {
        if (e && e.name === "AbortError") return;
        pane.textContent = "the tail stopped: " + e.message;
      });
  }

  // Elapsed comes from the controller when it is on the wire, for the same
  // reason every other age does. Falling back to the anchored clock keeps a
  // job visible that state has not caught up with yet.
  function runElapsedSeconds(job, view, nowMs) {
    if (view && typeof view.elapsed_seconds === "number") return view.elapsed_seconds;
    var start = instant(job.started_at);
    if (!isFinite(start)) return 0;
    return Math.max(0, Math.round((nowMs - start) / 1000));
  }

  function renderRunning() {
    var list = document.getElementById("runningList");
    var state = latest || {};
    var active = (state.jobs || []).filter(function (j) { return !j.finished_at; });
    var nowMs = controllerNow();
    var queued = (state.queued || []).length;
    var waits = state.queued_waiting_seconds || {};
    var longest = 0;
    Object.keys(waits).forEach(function (k) { if (waits[k] > longest) longest = waits[k]; });

    var sub = document.getElementById("runningSub");
    sub.textContent = "";
    if (!active.length) {
      stopRunTails();
      list.textContent = "";
      sub.appendChild(txt("Nothing is running. Every device in the pool is free."));
      list.appendChild(el("div", "empty", "No active leases."));
      return;
    }
    sub.appendChild(txt(active.length + (active.length === 1 ? " active lease" : " active leases")));
    if (queued) {
      sub.appendChild(txt(" · " + queued + (queued === 1 ? " job queued" : " jobs queued") + " · longest wait "));
      sub.appendChild(el("span", longest >= 600 ? "warn" : null, ago(longest)));
    }

    active.sort(function (a, b) { return (a.device_id || "").localeCompare(b.device_id || ""); });

    // Anything that has stopped running loses its card and its reader.
    var live = {};
    active.forEach(function (j) { live[j.id] = true; });
    Object.keys(runCards).forEach(function (id) {
      if (live[id]) return;
      runCards[id].abort();
      if (runCards[id].root.parentNode) runCards[id].root.parentNode.removeChild(runCards[id].root);
      delete runCards[id];
    });

    // Everything still running keeps the card and the stream it already has.
    var empty = list.querySelector(".empty");
    if (empty) list.removeChild(empty);
    active.forEach(function (job) {
      var entry = runCards[job.id];
      if (!entry) {
        entry = runCard(job, nowMs);
        runCards[job.id] = entry;
      } else {
        updateRunCard(entry, job, nowMs);
      }
      list.appendChild(entry.root);
    });
  }

  // Only the numbers move. The tail pane and its reader are untouched.
  function updateRunCard(entry, job, nowMs) {
    var view = job.device_id ? deviceIndex[job.device_id] : null;
    var elapsed = runElapsedSeconds(job, view, nowMs);
    var limit = job.max_runtime_seconds || 0;
    var remaining = limit ? limit - elapsed : null;
    var soon = remaining !== null && remaining <= 900;
    entry.fill.style.width = (limit ? Math.min(100, elapsed / limit * 100) : 12) + "%";
